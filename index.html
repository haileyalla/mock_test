<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>헤일리올라 | 모두가 백점이야</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#102a56; --navy2:#1b3a72; --gold:#ffe59a; --gold2:#ffe59a; --red:#ed3038; --paper:#fbf8ef; --ink:#102a56; --mute:#7e776d;
  --line:#e7dfd1; --ok:#2e7d32; --bad:#ed3038; --warn:#906500; --card:#fffdf8; --tint:#f6f1e4;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;word-break:keep-all}
button{font:inherit;cursor:pointer;border:0;border-radius:18px}
input,textarea,select{font:inherit}
.hide{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:22px}
header.top{background:var(--paper);color:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header.top .brand{font-family:"Nanum Brush Script",cursive;font-weight:400;font-size:34px;line-height:1;cursor:pointer}
header.top .brand small{display:block;font-family:"Noto Sans KR";font-weight:600;font-size:12px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
.btn{background:var(--navy);color:#fff;padding:0 22px;height:56px;font-weight:900;font-size:17px;border-radius:18px}
.btn.gold{background:var(--gold);color:var(--navy);border:1.6px solid var(--gold)}
.btn.ghost{background:#fff;color:var(--navy);border:1.6px solid var(--navy)}
.btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 12px 34px rgba(40,38,31,.06)}
h1,h2,h3{margin:0 0 8px;font-weight:700}
h2{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1.2}
.mute{color:var(--mute);font-size:14px}
/* home */
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.exam-item{border:1.6px solid var(--line);border-radius:18px;padding:16px;background:#fff;text-align:left;transition:border-color .15s}
.exam-item.sel{border-color:var(--navy);background:#fff6d8}
.exam-item b{display:block;font-size:17px;line-height:1.4;word-break:keep-all;overflow-wrap:break-word}
.exam-item b .les{display:block;font-size:15px;font-weight:700;color:var(--mute);margin-top:2px}
.exam-item span{color:var(--mute);font-size:13px}
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-size:15px;font-weight:800;color:#5f584f}
.field{min-width:0}
.field input,.field select{width:100%;min-width:0;box-sizing:border-box;height:64px;padding:0 20px;border:1.5px solid var(--line);border-radius:18px;font-size:18px;font-weight:600;background:#fff;color:var(--navy);outline:none}
.field input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(16,42,86,.07)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* exam */
.exam-bar{display:flex;align-items:center;gap:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:12px}
.timer.low{background:var(--red)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:12px 0}
.nav button{height:42px;border-radius:12px;background:#fff;border:1.4px solid var(--line);font-weight:900;color:var(--navy)}
.nav button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav button.cur{outline:3px solid var(--red);outline-offset:1px}
.passage{background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:16px;padding:16px 18px;margin:12px 0;font-size:15.5px}
.passage .ttl{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:6px}
.passage p{margin:0}
.passage p.txt{font-size:16px;line-height:1.75;margin:0 0 10px;text-align:left;hyphens:none}
.passage p.hd{font-weight:700;color:var(--navy);margin:8px 0 4px}
.passage p.hd:first-of-type{margin-top:0}
.excerpt{line-height:1.8;font-size:15.5px}
.stem.given{background:#fff6d8;border-color:#efd06d;line-height:1.7}
.passage p.dlg{line-height:1.7;margin:0 0 4px;padding-left:1.6em;text-indent:-1.6em}
.qhead{font-weight:800;font-size:19px;margin:18px 0 8px;line-height:1.5}
.qhead .no{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:2px 9px;margin-right:8px;font-size:13px;font-weight:900;vertical-align:middle}
.stem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.4px solid var(--line);border-radius:14px;padding:14px;font-size:16px}
.opt .c{flex:none;width:29px;height:29px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font-weight:900;color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#fff6d8}
.opt.sel .c{background:var(--navy);color:#fff}
textarea.ans{width:100%;min-height:110px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;line-height:1.5}
.cond{font-size:14px;color:var(--warn);margin:6px 0}
.qnav{display:flex;justify-content:space-between;margin:16px 0}
u{text-decoration-thickness:2px;text-underline-offset:3px}
u.ul{font-weight:700;text-decoration-thickness:2.5px;text-underline-offset:4px;text-decoration-color:var(--red)}
/* report */
.report{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;max-width:640px;margin:0 auto;box-shadow:0 12px 34px rgba(40,38,31,.06)}
.report .head{background:var(--navy);color:#fff;padding:20px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.report .head .t{font-weight:900;font-size:22px;letter-spacing:-.04em}
.report .head .t small{display:block;font-family:"Nanum Brush Script",cursive;font-weight:400;font-size:26px;color:var(--gold);line-height:1;margin-bottom:6px}
.report .head .who{text-align:right;font-size:14px;line-height:1.4}
.report .body{padding:20px 22px}
.score{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.dial{position:relative;width:132px;height:132px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.dial .n b{font-family:"Kalam",cursive;font-size:44px;font-weight:700;color:var(--red);letter-spacing:-.04em}
.dial .n small{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.score .split{font-size:14px;color:var(--mute);line-height:1.8}
.score .split b{color:var(--ink)}
.areas{display:grid;gap:9px;margin:14px 0}
.area{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:14px}
.area .bar{height:12px;background:var(--tint);border-radius:6px;overflow:hidden}
.area .bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.area.weak .bar i{background:var(--bad)}
.area.strong .bar i{background:var(--ok)}
.area b{text-align:right;font-variant-numeric:tabular-nums}
.cohort{background:var(--tint);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0 12px;line-height:1.7}
.diag{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.diag .ttl{font-weight:800;font-size:13px;color:var(--navy);margin-bottom:6px}
.drow{display:grid;grid-template-columns:1fr 44px 24px;font-size:13.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border:0}
.drow i{font-style:normal;color:var(--mute);text-align:right}
.drow b{text-align:right}
.drow.bad b{color:var(--bad)}
.drow.ok b{color:var(--ok)}
.tasks{margin:4px 0 0 18px;padding:0;font-size:14px}
.tasks li{margin:2px 0}
.verdict{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:12px 0;margin:14px 0;font-size:14.5px}
.verdict p{margin:0 0 10px}
.verdict .line{display:block;margin-top:3px;padding-left:2px}
.verdict .sub{display:block;margin-top:3px;color:var(--mute);font-size:13.5px;padding-left:2px}
.verdict .tag{display:inline-block;font-weight:800;color:#fff;background:var(--navy);border-radius:6px;padding:1px 8px;font-size:12px;margin-bottom:2px}
.verdict .tag.warn{background:var(--red)}
.wrong{font-size:13.5px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.rv .hd{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.rv .num{background:var(--navy);color:#fff;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:900}
.rv .qq{font-weight:800;font-size:16px;line-height:1.5}
.rv .op{display:flex;gap:10px;padding:9px 12px;border:1.4px solid var(--line);border-radius:12px;margin-top:7px;font-size:15px;background:#fff}
.rv .op .c{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:13px}
.rv .op.mine{border-color:var(--red);background:#fff1f1}
.rv .op.mine .c{border-color:var(--red);background:var(--red);color:#fff}
.rv .op.ans{border-color:var(--ok);background:#eef7ee}
.rv .op.ans .c{border-color:var(--ok);background:var(--ok);color:#fff}
.rv .why{margin-top:10px;background:var(--tint);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.rv .why b{color:var(--navy)}
.rv .tagline{font-size:12px;color:var(--mute);margin-top:6px}
.rt .op{cursor:pointer}
.rt .op.picked{border-color:var(--navy);background:#fff6d8}
.done-msg{text-align:center;padding:26px;font-weight:800;color:var(--ok)}
.wrong table{width:100%;border-collapse:collapse}
.wrong th,.wrong td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.wrong th:nth-child(n+3),.wrong td:nth-child(n+3){white-space:nowrap;text-align:center}
.wrong th{color:var(--mute);font-weight:500;font-size:12.5px}
.report .foot{background:var(--tint);padding:10px 22px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#fff3cd;color:var(--warn);font-weight:700}
.badge.ok{background:#e6f4ea;color:var(--ok)}
/* teacher */
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{background:#fff;border:1.5px solid var(--line);padding:8px 14px;font-weight:700;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs button{border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.list th,table.list td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
table.list th{background:var(--tint);font-weight:700;font-size:13px}
table.list tr:hover td{background:#fafafa;cursor:pointer}
.items{display:grid;gap:6px}
.item{display:grid;grid-template-columns:44px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.item .bar{height:14px;background:var(--tint);border-radius:7px;overflow:hidden}
.item .bar i{display:block;height:100%;background:var(--navy)}
.item.low .bar i{background:var(--bad)}
.grade-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.grade-box .model{background:var(--tint);padding:8px 10px;border-radius:8px;font-size:14px;margin:6px 0}
.grade-box .stu{background:#fff;border:1px dashed var(--line);padding:8px 10px;border-radius:8px;font-size:15px;white-space:pre-wrap;margin:6px 0}
.grade-box input[type=number]{width:80px;padding:6px;border:1.5px solid var(--line);border-radius:8px;font-size:16px}
.crit{font-size:13px;color:var(--mute)}
.crit .hit{color:var(--ok);font-weight:700}
.crit .miss{color:var(--bad)}
.askwrap{position:fixed;inset:0;background:rgba(16,42,86,.45);display:grid;place-items:center;z-index:20;padding:20px}
.askwrap.hide{display:none}
.askcard{background:var(--card);border-radius:22px;padding:24px;max-width:380px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.askcard b{font-size:19px}
.askcard .actions{margin-top:0;grid-template-columns:1fr 1fr}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* hero */
.hero-screen{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:22px}
.hero{width:min(760px,95vw);min-height:560px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--navy);border:0}
.hero .brand{font-family:"Nanum Brush Script",cursive;font-size:clamp(58px,8vw,88px);line-height:.95;margin-bottom:5px;letter-spacing:-.02em}
.hero .slogan{font-family:"Nanum Brush Script",cursive;font-size:clamp(54px,7.5vw,82px);line-height:.95;margin-bottom:24px;letter-spacing:-.02em}
.hero .hundred{position:relative;display:inline-block;font-family:"Kalam",cursive;font-weight:700;font-size:clamp(165px,29vw,235px);line-height:.92;letter-spacing:-.055em;color:var(--red);margin:8px 0 6px}
.hero .hundred::after{content:"";position:absolute;left:12%;right:9%;bottom:-4px;height:7px;border-radius:999px;background:var(--red);opacity:.82}
.hero .tap{margin-top:35px;font-size:14px;font-weight:600;color:#9c958b}
.page-sub{margin:0 0 24px;color:var(--mute);font-size:16px;font-weight:500}
.name-field{max-width:320px}
.name-field input{width:100%;max-width:320px;height:58px;font-size:18px}
.btn.big{width:100%;height:60px;font-size:18px;margin-top:18px}
.teacher-link{text-align:center;margin-top:22px}
.teacher-link button{background:none;border:0;color:#9c958b;font-size:12px;text-decoration:underline;padding:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.pick button{height:66px;border:1.6px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);font-size:19px;font-weight:900;transition:.15s}
.pick button.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 7px 18px rgba(16,42,86,.13)}
.pick button:disabled{background:#fcfcfb;color:#a1a5ac;border-style:dashed}
.actions{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .btn{width:100%}
@media (max-width:600px){.actions{grid-template-columns:1fr}.area{grid-template-columns:96px 1fr 44px}.report .head{flex-direction:column;align-items:flex-start}.report .head .who{text-align:left}}

/* ---------- phone ---------- */
@media (max-width:600px){
  .wrap{padding:12px}
  .card{padding:20px 16px;border-radius:20px}
  h2{font-size:24px}
  .page-sub{font-size:14px;margin-bottom:16px}
  .field input,.field select{height:56px;font-size:17px;padding:0 16px}
  .pick{grid-template-columns:1fr 1fr;gap:10px}
  .pick button{height:58px;font-size:17px}
  .actions{grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .btn{height:52px;font-size:16px;padding:0 14px}
  .hero{min-height:calc(100vh - 120px)}
  .hero .brand{font-size:56px}
  .hero .slogan{font-size:50px}
  .hero .hundred{font-size:150px}
  header.top{padding:10px 14px}
  header.top .brand{font-size:28px}
  .nav{grid-template-columns:repeat(8,1fr);gap:5px}
  .nav button{height:36px;font-size:13px;border-radius:9px}
  .passage{padding:12px 12px 12px 14px;font-size:14.5px;border-radius:12px}
  .passage p.txt{font-size:15px;line-height:1.65}
  .qhead{font-size:16px}
  .opt{padding:11px 12px;font-size:15px;gap:9px;border-radius:12px}
  .opt .c{width:26px;height:26px;font-size:13px}
  .qnav .btn,.row .btn{flex:1}
  .exam-item b{font-size:15px}
  .report .body{padding:16px 14px}
  .score{gap:12px}
  .dial{width:110px;height:110px}
  .dial .n b{font-size:36px}
  .area{grid-template-columns:84px 1fr 42px;font-size:13px}
  .wrong{font-size:12.5px}
  table.list{font-size:12.5px}
  table.list th,table.list td{padding:6px 5px}
  .item{grid-template-columns:38px 1fr 70px;font-size:12px}
  .grade-box{padding:10px}
}
@media print{header.top,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brandHome">헤일리올라<small>내신 실전 모의고사</small></div>
  <div class="exam-bar" id="topRight"></div>
</header>

<!-- ===== HERO ===== -->
<section id="hero" class="hero-screen">
  <button class="hero" id="heroBtn" aria-label="시작">
    <div class="brand">헤일리올라</div>
    <div class="slogan">모두가 백점이야</div>
    <div class="hundred">100</div>
    <div class="tap">화면을 눌러 시작하세요</div>
  </button>
</section>

<!-- ===== HOME (step wizard) ===== -->
<section id="home" class="wrap hide">
  <div class="card step" id="step1">
    <h2>헤일리영어 모의 내신고사</h2>
    <p class="page-sub">이름을 입력하세요. 시험 시작 전에 선생님 승인을 받습니다.</p>
    <div class="field name-field"><label>이름</label><input id="inName" placeholder="예: 김하늘" autocomplete="off" maxlength="12"></div>
    <div class="field name-field" style="margin-top:14px"><label>나만의 비밀번호 (숫자 4자리)</label><input id="inPw" type="tel" inputmode="numeric" maxlength="4" placeholder="예: 1123" autocomplete="off"></div>
    <p class="mute" id="pwHint" style="font-size:13px;margin:8px 0 0;color:var(--red);min-height:18px"></p>
    <p class="mute" style="font-size:13px;margin:4px 0 0">처음이면 원하는 숫자 4자리를 정하세요. <b>맨 앞자리는 0을 쓸 수 없어요.</b> 다음부터 같은 번호로 들어옵니다.</p>
    <button class="btn gold big" id="btnS1" disabled>다음</button>
    
  </div>
  <div class="card step hide" id="step2">
    <h2>학교</h2><p class="page-sub">학교를 선택하세요.</p>
    <div class="pick" id="pickLevel"><button type="button" data-v="중">중학교</button><button type="button" data-v="고">고등학교</button></div>
    <div class="actions"><button class="btn ghost" data-back="step1">이전</button><span></span></div>
  </div>
  <div class="card step hide" id="step3">
    <h2>학년</h2><p class="page-sub" id="gradeSub">학년을 선택하세요.</p>
    <div class="pick" id="pickGrade"></div>
    <div class="actions"><button class="btn ghost" data-back="step2">이전</button><span></span></div>
    <p class="mute" id="lookupMsg" style="margin:12px 0 0;min-height:20px"></p>
  </div>
  <div class="card step hide" id="step4">
    <h2 id="s4title">교과서</h2><p class="page-sub" id="s4sub">교과서를 선택하세요.</p>
    <div class="pick" id="pickBook"></div>
    <div class="actions"><button class="btn ghost" data-back="step3">이전</button><span></span></div>
  </div>
  <div class="card step hide" id="step4b">
    <h2>회차</h2><p class="page-sub">응시할 회차를 선택하세요.</p>
    <div class="pick" id="pickRound"></div>
    <div class="actions"><button class="btn ghost" data-back="step4">이전</button><span></span></div>

Why is it called the Recycled Orchestra?","It’s because our musical instruments are made of objects from a landfill.","That’s why it’s also known as the Landfill Harmonic Orchestra.","Most of us in the orchestra are from Cateura, a small town in Paraguay. There is a huge landfill in our town.","Some people even say that Cateura itself is a giant landfill.","Many of us are poor. There weren’t many hopes and dreams in our town.","Everything began to change, however, when we met Favio Chávez."]},answer:4},{n:18,area:"본문 독해",q:"윗글에서 Cateura에 관해 알 수 있는 것을 모두 고른 것은?",pts:2.5,stem:["(a) Cateura is a small town in Paraguay.   (b) There is a huge landfill in the town.   (c) Most people in the town are rich.   (d) Some people say the town itself is a huge landfill."],opts:["(a), (b)","(b), (c)","(a), (c), (d)","(b), (c), (d)","(a), (b), (d)"],passage:{title:"[16~18] 다음 글을 읽고 물음에 답하시오.",lines:["My name is Andrea and I’m a violinist in the Recycled Orchestra.","Why is it called the Recycled Orchestra?","It’s because our musical instruments are made of objects from a landfill.","That’s why it’s also known as the Landfill Harmonic Orchestra.","Most of us in the orchestra are from Cateura, a small town in Paraguay. There is a huge landfill in our town.","Some people even say that Cateura itself is a giant landfill.","Many of us are poor. There weren’t many hopes and dreams in our town.","Everything began to change, however, when we met Favio Chávez."]},answer:5},{n:19,area:"본문 독해",q:"Favio가 매립지의 물건으로 악기를 만들자고 한 배경을 바르게 설명한 것은?",pts:2.5,stem:[],opts:["마을에 악기가 거의 없었고 새 악기를 살 형편도 안 됐기 때문","매립지를 청소하고 싶었기 때문","아이들이 재활용을 배우고 싶어 했기 때문","Nicholas가 먼저 제안했기 때문","음악보다 환경 교육이 중요했기 때문"],passage:{title:"[19~21] 다음 글을 읽고 물음에 답하시오.",lines:["Favio was an environmental educator and a musician.","He wanted to teach us music, but there was a big problem.","There were only a few musical instruments in the whole town.","We couldn’t afford to buy new ones. But Favio didn’t give up.","He said that we could make musical instruments with objects from the landfill.","A talented man named Nicholas was able to put this idea into practice.","He made violins from oil drums. He turned water pipes into flutes."]},answer:1},{n:20,area:"본문 독해",q:"Nicholas가 한 일로 가장 적절한 것은?",pts:2.5,stem:[],opts:["He bought new violins for everyone.","He taught Andrea how to read music.","He put Favio's idea into practice by making instruments.","He moved the landfill out of town.","He organized the first concert."],passage:{title:"[19~21] 다음 글을 읽고 물음에 답하시오.",lines:["Favio was an environmental educator and a musician.","He wanted to teach us music, but there was a big problem.","There were only a few musical instruments in the whole town.","We couldn’t afford to buy new ones. But Favio didn’t give up.","He said that we could make musical instruments with objects from the landfill.","A talented man named Nicholas was able to put this idea into practice.","He made violins from oil drums. He turned water pipes into flutes."]},answer:3},{n:21,area:"본문 독해",q:"다음 문장이 들어가기에 가장 적절한 곳은?",pts:2.5,stem:["But Favio didn't give up.","He wanted to teach us music, but there was a big problem. ( ① ) There were only a few musical instruments in the whole town. ( ② ) We couldn't afford to buy new ones. ( ③ ) He said that we could make musical instruments with objects from the landfill. ( ④ ) A talented man named Nicholas was able to put this idea into practice. ( ⑤ )"],opts:["①","②","③","④","⑤"],passage:{title:"[19~21] 다음 글을 읽고 물음에 답하시오.",lines:["Favio was an environmental educator and a musician.","He wanted to teach us music, but there was a big problem.","There were only a few musical instruments in the whole town.","We couldn’t afford to buy new ones. But Favio didn’t give up.","He said that we could make musical instruments with objects from the landfill.","A talented man named Nicholas was able to put this idea into practice.","He made violins from oil drums. He turned water pipes into flutes."]},answer:3} ad",lines:["When I hear or read a news story,","· I check whether the source can be trusted.","· I check if the news story appears in other truthful sources.","· I read other people's comments.","· Before I tell others about a news story, I read the whole story, not just the headline.","· I find more information that supports the story.","· I check if the news writers are real and can be trusted.","When I spot fake news,","· I report it as a false posting.","· I leave a comment to warn others.","· I tell people around me."]},answer:1},{n:27,area:"기타 지문 · 교과서 보충",q:"본문 전체의 주제로 가장 적절한 것은?",pts:2.5,stem:[],opts:["Newspapers should never publish jokes.","Fake news has existed for various reasons, so we need to read the news critically.","Zoos must keep their animals in stronger cages.","Competition between newspapers is always harmful.","Readers should only trust TV news."],passage:null,answer:2},{n:28,area:"기타 지문 · 교과서 보충",q:"본문의 'Fake news can be very harmful in that it can make people less informed.'와 의미가 같은 것은?",pts:2.5,stem:[],opts:["Fake news can be very harmful because it can make people less informed.","Fake news can be very harmful although it can make people less informed.","Fake news can be very harmful so that it can make people less informed.","Fake news can be very harmful unless it makes people less informed.","Fake news can be very harmful while it makes people less informed."],passage:null,answer:1}],essays:[{n:29,q:"다음 우리말을 괄호 안의 말을 이용하여 영작하시오.",pts:7,area:"서술형",cond:"whether를 사용할 것.",parts:[{label:"(1)",ko:"나는 그 기사가 정말 사실인지 모르겠다. (know, really true)",pts:3.5,answers:["I don't know whether the article is really true.","I do not know whether the article is really true."]},{label:"(2)",ko:"나는 그 기사가 사실인지 아닌지 확인해야 한다. (have to check, true or not)",pts:3.5,answers:["I have to check whether the article is true or not."]}],prompt:[],model:"I don't know whether the article is really true. I have to check whether the article is true or not.",crit:[]},{n:30,q:"다 ional Ones","More Rules, More Learning: Designing Complex Games","Learning Outcomes Cannot Be Measured by Games"],answer:2,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["Learning games need to be what we call ‘fun enough.’ Many new learning-game developers try to design an entertaining game. Unfortunately, that often makes learning harder rather than easier. Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes. Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high. Yes, the game should be engaging with a mild level of fun, but learning should be the goal. Focus on engagement rather than entertainment. The goals of the game play should be interactivity and engagement. Research shows that what makes games instructional is the level of interactivity and engagement the learners have with the content. Given those parameters, making sure the learners are engaged and active is far more important than making sure they are entertained."]},expl:"",type:"제목"},{n:2,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["스마트 기기는 아이들의 학습 능력을 향상시키는 데 도움이 된다.","정서적 성숙은 또래와의 대화를 통해 가장 빠르게 이루어진다.","운동 능력은 타고나는 것이므로 훈련으로 바꾸기 어렵다.","인간은 움직이도록 만들어졌으므로 활동적인 삶을 되찾아야 한다.","실내 활동보다 야외 활동이 학업 성취도를 직접적으로 높인다."],answer:4,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by ‘smart’ devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move—and through movement, we are meant to live extraordinary lives. Movement is life to us."]},expl:"",type:"요지"},{n:3,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Your Beliefs Decide What You Attract","Visualize It and It Will Come True","Positive Thinking: A Myth Without Evidence","Why Magnetic Words Fail in Relationships","Set Goals You Can Actually Measure"],answer:1,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]},expl:"",type:"제목"},{n:4,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["환경 변화는 생물 종의 신체 구조를 먼저 바꾼다.","문화가 다르면 지능의 발달 속도도 달라진다.","인간의 마음이 다양해야 종의 생존 가능성이 높아진다.","자연선택은 개체보다 집단 단위로 일어난다.","재난 대비 교육은 어릴수록 효과가 크다."],answer:3,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:["It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe—the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind—if there were only one human nature—then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out. This variation preserves the evolvability of our species."]},expl:"",type:"요지"},{n:5,area:"독해",q:"윗글에서 필자가 주장하는 바로 가장 적절한 것은?",pts:2.9,stem:[],opts:["불확실성을 줄이려면 계획을 더 구체적으로 세워야 한다.","예측 가능한 환경을 만들어 불안을 줄여야 한다.","타인의 계획을 존중하고 함부로 간섭하지 말아야 한다.","목표를 이루려면 세운 계획을 끝까지 밀어붙여야 한다.","계획이 뜻대로 되지 않을 수 있음을 받아들일 줄 알아야 한다."],answer:5,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:['Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty. Human beings want to know. When we don’t know, when things are uncertain, we often feel frightened and become inflexible. So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time. We cling to our plans and ideas about how things should be and turn out ever so desperately. And there’s nothing wrong with having plans. I think it’s a beautiful thing. <u class="g">But there’s a difference between planning and thinking all your plans have to come to fruition.</u> American president Eisenhower once said: ‘Plans are worthless, but planning is everything.’ Imagine if we all used pencil instead of ink to write in our calendars and planners. Both figuratively and literally. Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens. And if we could try our best to be all right with that.']},expl:"",type:"주장"},{n:6,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["the health risks of high-intensity workouts for beginners","two ways the body produces energy and how they affect exercise","foods that help athletes recover after intense training","how lung capacity differs between athletes and non-athletes","the role of sugar in building muscle strength"],answer:2,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and easier for our bodies to access. It’s a kind of backup system and turbo boost when the body doesn’t have enough oxygen. But anaerobic energy is inefficient and can be toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often so miserable. Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we’re warmed up, exercise feels easier. The body has switched from anaerobic to aerobic respiration."]},expl:"",type:"주제"},{n:7,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["신문 기사는 문장 길이를 통일해야 읽기 쉽다.","글의 논지 전개보다 시각적 배치가 언제나 더 중요하다.","기자는 독자의 수준에 맞추어 어휘를 선택해야 한다.","문단은 짧게 쓰되 지나치게 잘게 나누지는 말아야 한다.","긴 문단은 글쓴이의 사고의 깊이를 보여 준다."],answer:4,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["Keep your paragraphs short. Writing is visual—it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear—a reader can go for miles without relief. Don’t worry; the gains far outweigh the hazards. But don’t go too far. A succession of tiny paragraphs is as annoying as a paragraph that’s too long. I’m thinking of all those tiny paragraphs—verbless wonders—written by modern journalists trying to make their articles quick ‘n’ easy. Actually they make the reader’s job harder by chopping up a natural train of thought."]},expl:"",type:"요지"},{n:8,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["how our food preferences are shaped by the people around us","why traditional village recipes are disappearing today","the biological basis of the human sense of taste","health risks of following food trends on social media","ways to develop a more objective judgment of food"],answer:1,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn’t flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."]},expl:"",type:"주제"},{n:9,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Stop Feeling: The Stoic Path to Peace","Why Criticism Hurts More Than Job Loss","Your Emotions Begin With Your Judgments","Automatic Reactions We Can Never Change","Anger Is Always a Reasonable Response"],answer:3,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren’t just automatic reactions. They’re shaped by how we interpret events. Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. Change the judgment, and you change the emotion. This doesn’t mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better."]},expl:"",type:"제목"},{n:10,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["고대 그리스 조각은 사실주의 예술의 정점을 보여 준다.","추상 미술은 대중에게 이해되기 어렵다는 한계가 있다.","예술 작품의 가치는 제작 기법의 숙련도로 결정된다.","시대가 달라져도 예술이 추구하는 목적은 변하지 않는다.","예술을 현실의 모방으로만 규정하는 것은 충분하지 않다."],answer:5,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["The ancient Greeks felt that the visual artist’s goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis—simple copying—does not sufficiently define art."]},expl:"",type:"요지"},{n:11,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["training methods that prevent common running injuries","why our bodies know more about running than our minds do","how supercomputers simulate complex human movement","the history of long-distance running competitions","reasons running is better exercise than walking"],answer:2,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오.",lines:["If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."]},expl:"",type:"주제"},{n:12,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["반려견의 냄새를 없애려면 잦은 목욕이 가장 효과적이다.","반려견의 피부 질환은 대부분 유전적 요인에서 비롯된다.","반려동물 정기 검진은 질병을 조기에 발견하는 데 도움이 된다.","반려동물 돌봄은 주인의 취향이 아니라 동물의 필요를 기준으로 해야 한다.","털이 두꺼운 반려견은 빗질보다 목욕이 더 중요하다."],answer:4,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오.",lines:["Our number one criterion for how we care for our pets should be, “Is this what they actually need? How is it impacting them?” rather than, “What do I want?” For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the ‘doggy’ smell, but veterinary dermatologists warn against such practices, as they are not good for a dog’s skin. If someone is really concerned about their dog’s smell they can use waterless shampoo and thoroughly brush their dog every day but keep the baths down to once or twice a week at most. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don’t need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks."]},expl:"",type:"요지"},{n:13,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Sudoku Is Mathematics, Whether You Admit It or Not","Numbers: The Heart of Every Newspaper Puzzle","Why Newspapers Stopped Printing Logic Games","Art and Math: Two Worlds That Never Meet","Puzzles That Actually Improve Your Memory"],answer:1,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:["The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections. Take, for example, the Sudoku puzzles that appear daily in newspapers. The objective is to complete a 9 × 9 grid, starting from a few given numbers or clues, while ensuring that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once. But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols. They could be nine letters or nine shapes. It’s the pattern that matters. One Irish daily paper publishes these puzzles with the statement ‘There’s no maths involved, simply use reasoning and logic!’ It seems that even the idea that something might be spoiled by mathematics is enough to scare off potential solvers! Could you imagine the promotion of an exhibition in the National Gallery with the slogan ‘No art involved, just painting and sculpture’? If you can do Sudoku, you can do maths!"]},expl:"",type:"제목"},{n:14,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["the difficulty of observing stars without modern equipment","ancient civilizations that worshipped the stars","how our understanding of the universe has developed over time","Galileo’s conflict with the authorities of his time","why the telescope replaced mathematics in astronomy"],answer:3,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오.",lines:['Even before telescopes existed, people looked out into space and tried to understand the universe. The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea. Copernicus watched the stars and took measurements by eye. He concluded that the view of the universe accepted at the time—that the Sun traveled around Earth—was wrong, and that it was in fact Earth that traveled around the Sun. <u class="g">Despite widespread objections to his ideas, he published his theory in a book.</u> Later astronomers built on Copernicus’ work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth’s Moon. He also confirmed that Copernicus’ theory was correct. Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works.']},expl:"",type:"주제"},{n:15,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["the origin of body parts used as early measuring tools","how trade disputes shaped early legal systems","differences between subjective and objective knowledge","the role of language in preserving local cultures","why shared definitions became necessary for units of measurement"],answer:5,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오.",lines:['To harness the full potential of units of measurement, we need some degree of consistency. Subjective measures contain useful knowledge, but this can be difficult to share, based as it is on an individual’s experience. The historian of science Theodore M. Porter describes measurement as a ‘technology of distance’: a tool that uses shared rules to bridge differences of culture and geography, allowing for the exchange of information. <u class="g">Following this logic, if measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate.</u> In the earliest societies, these definitions might need to be shared no more widely than a single settlement, meaning that the definition can be no more complex than knowing that a unit was equal to a certain body part. As these communities grew in size, though, the inadequacies of this system would become evident. Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement.']},expl:"",type:"주제"},{n:16,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Underground Cities Built by Insects and Humans","Tiny Farmers: How Leaf-Cutter Ants Grow Their Food","Why Ants Prefer Leaves to Any Other Food","The Fungus That Secretly Controls an Entire Colony","Lessons Human Farmers Learned from Insects"],answer:2,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:["With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they’re farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don’t eat these leaves. Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground ‘gardens.’ The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Using this successful farming strategy, the ants build enormous nests underground, something spanning hundreds of square meters. Just like humans, they have perfected an agricultural civilization."]},expl:"",type:"제목"},{n:17,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["methods of raising self-esteem in early childhood","the danger of relying too much on others’ opinions","how the brain stores memories of social rejection","self-esteem as a system that monitors our social acceptance","why conscious thinking slows down social judgment"],answer:4,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오.",lines:['From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. <u class="g">The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.</u> When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.']},expl:"",type:"주제"},{n:18,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["인터넷은 속어가 퍼지는 방식과 언어 규범의 권위를 바꾸어 놓았다.","표준 영어를 지키려면 방송 언어에 대한 규제를 강화해야 한다.","콘텐츠 제작자는 전통 매체 종사자보다 어휘 사용이 부정확하다.","밈의 빠른 확산은 결국 언어의 의미를 왜곡하는 결과를 낳는다.","사회적 배경이 다양할수록 표준어를 습득하기가 더 어려워진다."],answer:1,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오.",lines:["The role of ‘slang’ in popular culture has fundamentally changed because of the internet. Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our channels of communication. If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media. Social media completely broke that barrier. The playing field is now level, and public access is democratized. Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to enforce the old rules. TV presenters and journalists might not have been able to use slang, but content creators can. We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before. Content creators also come from a greater variety of backgrounds than people working in traditional media. This means that slang can more naturally go beyond the economic and social barriers that once limited its growth. The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace."]},expl:"",type:"요지"},{n:19,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Chase the Highs, Escape the Lows","Why Happiness Always Returns to Its Baseline","Children Feel Joy More Deeply Than Adults Do","First Love: The Feeling That Never Fades","Buy Less, Want Less, Live Better"],answer:2,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오.",lines:["Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience—a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust—to new information and events both good and bad—and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline—back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids—like adults—adapt."]},expl:"",type:"제목"},{n:20,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["health risks of taking sleeping pills over a long period","how caffeine temporarily blocks the feeling of sleepiness","the best time of day to take a short afternoon nap","why some people can function well on very little sleep","a molecular mechanism that makes lost sleep impossible to ignore"],answer:5,passage:{title:"[20] 다음 글을 읽고 물음에 답하시오.",lines:["Although you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can’t become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep catches up with you."]},expl:"",type:"주제"},{n:21,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["과학적 측정은 언제나 소수점 이하까지 정확해야 한다.","일반 대중은 숫자보다 그림 자료를 더 신뢰하는 경향이 있다.","측정의 불확실성이 문제가 되는 정도는 사용 목적에 따라 달라진다.","유효 숫자가 많을수록 측정의 신뢰도는 반드시 높아진다.","천문학적 거리는 인간의 직관으로는 이해하기 어렵다."],answer:3,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오.",lines:['One of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative. Take, for example, the distance between Earth and the sun: 1.49597 × 10<sup>8</sup> km, as measured at one point during the year. This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! <u class="g">Whether or not the quoted number is “precise” therefore depends on what I’m intending to do with it.</u> If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately.']},expl:"",type:"요지"},{n:22,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Building Green Energy Still Burns Fossil Fuels","Renewables: The Cheapest Energy We Have Ever Had","How Solar Panels Cut the Cost of Mining","Transport Reform Must Come Before Energy Reform","The End of the Fossil Fuel Industry Is Finally Near"],answer:1,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오.",lines:["Richard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history. In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes. This transformation cannot happen without fossil fuels. For instance, production of concrete structures and steel elements require amounts of energy that is only possible to produce with fossil energy. Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels. Thus, the harder we push towards a renewable energy system, the faster we have to use fossil energy for the construction process. This is not only expensive, but also an undermining factor for our efforts to cut global emissions. Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements."]},expl:"",type:"제목"},{n:23,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["ethical problems caused by fully autonomous machines","the limits of the Turing test in modern computing","ancient myths that warned people against human pride","the long history of the human dream of thinking machines","how literature predicted the failure of artificial intelligence"],answer:4,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오.",lines:["Humans for centuries have dreamed of machines that could become intelligent and make human-like decisions. There have been myths about robots, automatons, and artificial beings since ancient Greece (e.g., the myth of Pandora, who released ills upon the world). Likewise, literature throughout history has dreamed of creating human-like creatures and thinking machines (e.g., Mary Shelley’s Frankenstein). In 1950, British mathematician Alan Turing asked whether machines could think and reason like humans and then developed the Turing test to measure a machine’s intelligence and whether the machines can think autonomously. A few years later, MIT professor John McCarthy coined “artificial intelligence,” replacing the previously used expression “automata studies.” Since then, artificial intelligence has become the study and practice of “making intelligent machines” that are programmed to think like humans—endowed by their creators with reasoning and learning."]},expl:"",type:"주제"},{n:24,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["The Fastest Reptile in Death Valley","How a Tortoise Survives a Year Without Fresh Water","Why Park Rangers Rescue Animals on the Road","Rain: The Only Enemy of the Desert Tortoise","Digging Tunnels: A Skill Shared by Desert Animals"],answer:2,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오.",lines:["The desert tortoise has a simple solution for coping with Death Valley’s extreme heat: It avoids it. The slow-moving creature hibernates during the winter and stays in its tunnel for much of the summer, meaning that it spends more than 90 percent of its life immobile. In fact, the tortoise usually only surfaces after a good rain. Then, it gets to work. The tortoise stocks up on water by eating plants and digging holes to collect rain. But to stay supplied with water through its extended hibernation, the reptile relies on something else—its highly sophisticated bladder. Unlike most animals, the tortoise’s bladder acts as a holding tank, allowing it to reabsorb water back into its body. Incredibly, a desert tortoise can go a full year without taking in any freshwater at all. And because its bladder is so important to a tortoise’s survival, park rangers often remind visitors not to stop and help the slow-movers across the road. Tortoises become so terrified when people pick them up that they empty their bladders, losing their precious water reserves."]},expl:"",type:"제목"},{n:25,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["the design principles of modern bicycle braking systems","why air resistance increases sharply with speed","practical ways to reduce energy loss in machines","the historical difference between force and motion","friction as the force that slows moving objects down"],answer:5,passage:{title:"[25] 다음 글을 읽고 물음에 답하시오.",lines:['Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. <u class="g">Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims.</u> This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. One of these is friction in the wheels rubbing on the axles. Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate.']},expl:"",type:"주제"},{n:26,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Typewriters Are Quietly Coming Back","Special Effects That Changed Modern Cinema","Editing Video the Way You Edit a Document","Why Videotape Still Beats Digital Files","The Hidden Cost of Digital Editing Systems"],answer:3,passage:{title:"[26] 다음 글을 읽고 물음에 답하시오.",lines:['All editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without having to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically. Linear editing was like composing a paper on a typewriter. <u class="g">If a mistake was made or new information needed to be added the whole piece had to be retyped.</u> Nonlinear editing, on the other hand, is like using a word processing program. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily.']},expl:"",type:"제목"},{n:27,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.9,stem:[],opts:["why good intentions alone are not enough for moral goodness","the danger of judging other people by their motives","Kant’s lasting contribution to modern ethical theory","how slapstick comedy reveals the values of a society","practical ways to reduce harm in everyday decisions"],answer:1,passage:{title:"[27] 다음 글을 읽고 물음에 답하시오.",lines:["A morally good person is one who does morally bad actions significantly less often than most and does morally good ones significantly more often than most. In judging a person not only her actions but also her intentions and motives are relevant. A morally good person must intend to do morally good actions and intend to avoid morally bad ones. A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good. Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual consequences of a person’s actions that count toward her being judged morally good or bad. But actual consequences are important. A person who always tries to prevent harm but never does, is not generally thought of as morally good. Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is regarded as morally good."]},expl:"",type:"주제"},{n:28,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["사진은 인간의 눈보다 세부 묘사를 포착하는 데 취약하다.","도구를 자주 사용할수록 그 형태를 더 정확히 기억한다.","사진의 평면성은 대상을 더 사실적으로 보이게 만든다.","사물과의 기능적 관계가 우리가 사물을 보는 방식을 왜곡한다.","시각적 기대는 충분한 훈련을 통해 완전히 제거할 수 있다."],answer:4,passage:{title:"[28] 다음 글을 읽고 물음에 답하시오.",lines:['Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind’s eye, we tend to “see” it in profile or at some other “ready for use” angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer’s head. <u class="g">The functional relationship we have with objects creates visual expectations that interfere with our ability to see “like a camera.”</u> The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don’t interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes.']},expl:"",type:"요지"}],essays:[{n:29,q:"다음은 윗글의 일부이다. 밑줄 친 ①~⑤ 중 <b>어법상 틀린 것 2개</b>를 찾아 기호를 쓰고 바르게 고쳐 쓰시오.",pts:5,area:"서술형",cond:"기호와 고친 형태를 함께 쓸 것 / 한 단어로만 고칠 것",parts:[{label:"",ko:"",pts:5,answers:["① can be discouraged → can discourage / ④ are → is"]}],prompt:[],stimulus:"",excerpt:"Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type ① <u>can be discouraged</u> a reader from even ② <u>starting</u> to read. You may think such frequent paragraphing will damage the development of your point. Don’t worry; the gains far ③ <u>outweigh</u> the hazards. But don’t go too far. A succession of tiny paragraphs ④ <u>are</u> as annoying as a paragraph that’s too long. Actually they make the reader’s job ⑤ <u>harder</u> by chopping up a natural train of thought.",model:"① can be discouraged → can discourage / ④ are → is",crit:[],scoring:["①은 뒤에 목적어 a reader가 있으므로 능동태(can discourage). ④의 주어는 단수 A succession(of 뒤 복수명사에 끌리지 말 것). ②는 from 뒤 동명사, ③은 복수주어 the gains와 수 일치, ⑤는 make+목적어+형용사(비교급)로 모두 옳음."],passageRef:"7번 지문",type:"어법 고치기"},{n:30,q:"윗글의 밑줄 친 문장과 같은 뜻이 되도록, 다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"There is로 시작할 것 / between A and B 구문을 사용할 것 / plan, come to fruition을 알맞은 형태로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["There is a difference between planning and thinking all your plans have to come to fruition."]}],prompt:[],stimulus:"계획을 세우는 것과 당신의 모든 계획이 반드시 실현되어야 한다고 생각하는 것 사이에는 차이가 있다.",excerpt:"",model:"There is a difference between planning and thinking all your plans have to come to fruition.",crit:[],scoring:["between 뒤 두 항목을 모두 동명사로 병렬시켰는지에 배점."],passageRef:"5번 지문",type:"밑줄 영작"},{n:31,q:"다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"현재진행 수동태를 사용할 것 / held, captive, devices를 어형 변화 없이 사용할 것 / 총 14단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["Many kids today are being held captive by ‘smart’ devices like phones and tablets."]}],prompt:[],stimulus:"오늘날 많은 아이들이 휴대전화와 태블릿 같은 ‘스마트’ 기기에 사로잡혀 있다.",excerpt:"",model:"Many kids today are being held captive by ‘smart’ devices like phones and tablets.",crit:[],scoring:["are being held(진행 수동) 정확성에 배점."],passageRef:"2번 지문",type:"조건 영작"},{n:32,q:"윗글의 주제를 <조건>에 맞게 한 문장의 영어로 쓰시오.",pts:5,area:"서술형",cond:"To attract로 시작할 것 / belief, match(또는 fit)를 반드시 포함할 것 / 12~18단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["To attract what you want, you must first hold a belief system that matches your desires."]}],prompt:[],stimulus:"— 필자가 가장 강력한 요인이라고 말한 것이 무엇인지 드러나도록 쓸 것",excerpt:"",model:"To attract what you want, you must first hold a belief system that matches your desires.",crit:[],scoring:["belief system이 가장 강력한 attractor라는 핵심이 드러나면 정답 처리."],passageRef:"3번 지문",type:"주제문 영작"}]},g1_suncheon:{id:"g1_suncheon",title:"고1 순천고 · 1회차 (모의고사)",grade:"고1",school:"순천고",round:1,minutes:60,scope:"2609 21~24, 29~34",mcq:[{n:1,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3.2,stem:[],opts:["스마트 기기는 아이들의 학습 능력을 향상시키는 데 도움이 된다.","정서적 성숙은 또래와의 대화를 통해 가장 빠르게 이루어진다.","운동 능력은 타고나는 것이므로 훈련으로 바꾸기 어렵다.","인간은 움직이도록 만들어졌으므로 활동적인 삶을 되찾아야 한다.","실내 활동보다 야외 활동이 학업 성취도를 직접적으로 높인다."],answer:4,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by ‘smart’ devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move—and through movement, we are meant to live extraordinary lives. Movement is life to us."]},expl:"",type:"요지"},{n:2,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3.2,stem:[],opts:["Your Beliefs Decide What You Attract","Visualize It and It Will Come True","Positive Thinking: A Myth Without Evidence","Why Magnetic Words Fail in Relationships","Set Goals You Can Actually Measure"],answer:1,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]},expl:"",type:"제목"},{n:3,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3.2,stem:[],opts:["환경 변화는 생물 종의 신체 구조를 먼저 바꾼다.","문화가 다르면 지능의 발달 속도도 달라진다.","인간의 마음이 다양해야 종의 생존 가능성이 높아진다.","자연선택은 개체보다 집단 단위로 일어난다.","재난 대비 교육은 어릴수록 효과가 크다."],answer:3,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe—the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind—if there were only one human nature—then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out. This variation preserves the evolvability of our species."]},expl:"",type:"요지"},{n:4,area:"독해",q:"윗글에서 필자가 주장하는 바로 가장 적절한 것은?",pts:3.2,stem:[],opts:["불확실성을 줄이려면 계획을 더 구체적으로 세워야 한다.","예측 가능한 환경을 만들어 불안을 줄여야 한다.","타인의 계획을 존중하고 함부로 간섭하지 말아야 한다.","목표를 이루려면 세운 계획을 끝까지 밀어붙여야 한다.","계획이 뜻대로 되지 않을 수 있음을 받아들일 줄 알아야 한다."],answer:5,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:['Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty. Human beings want to know. When we don’t know, when things are uncertain, we often feel frightened and become inflexible. So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time. We cling to our plans and ideas about how things should be and turn out ever so desperately. And there’s nothing wrong with having plans. I think it’s a beautiful thing. <u class="g">But there’s a difference between planning and thinking all your plans have to come to fruition.</u> American president Eisenhower once said: ‘Plans are worthless, but planning is everything.’ Imagine if we all used pencil instead of ink to write in our calendars and planners. Both figuratively and literally. Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens. And if we could try our best to be all right with that.']},expl:"",type:"주장"},{n:5,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3.2,stem:[],opts:["the health risks of high-intensity workouts for beginners","two ways the body produces energy and how they affect exercise","foods that help athletes recover after intense training","how lung capacity differs between athletes and non-athletes","the role of sugar in building muscle strength"],answer:2,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:["To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and easier for our bodies to access. It’s a kind of backup system and turbo boost when the body doesn’t have enough oxygen. But anaerobic energy is inefficient and can be toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often so miserable. Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we’re warmed up, exercise feels easier. The body has switched from anaerobic to aerobic respiration."]},expl:"",type:"주제"},{n:6,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3.2,stem:[],opts:["신문 기사는 문장 길이를 통일해야 읽기 쉽다.","글의 논지 전개보다 시각적 배치가 언제나 더 중요하다.","기자는 독자의 수준에 맞추어 어휘를 선택해야 한다.","문단은 짧게 쓰되 지나치게 잘게 나누지는 말아야 한다.","긴 문단은 글쓴이의 사고의 깊이를 보여 준다."],answer:4,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["Keep your paragraphs short. Writing is visual—it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear—a reader can go for miles without relief. Don’t worry; the gains far outweigh the hazards. But don’t go too far. A succession of tiny paragraphs is as annoying as a paragraph that’s too long. I’m thinking of all those tiny paragraphs—verbless wonders—written by modern journalists trying to make their articles quick ‘n’ easy. Actually they make the reader’s job harder by chopping up a natural train of thought."]},expl:"",type:"요지"},{n:7,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3.2,stem:[],opts:["how our food preferences are shaped by the people around us","why traditional village recipes are disappearing today","the biological basis of the human sense of taste","health risks of following food trends on social media","ways to develop a more objective judgment of food"],answer:1,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn’t flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."]},expl:"",type:"주제"},{n:8,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3.2,stem:[],opts:["Stop Feeling: The Stoic Path to Peace","Why Criticism Hurts More Than Job Loss","Your Emotions Begin With Your Judgments","Automatic Reactions We Can Never Change","Anger Is Always a Reasonable Response"],answer:3,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren’t just automatic reactions. They’re shaped by how we interpret events. Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. Change the judgment, and you change the emotion. This doesn’t mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better."]},expl:"",type:"제목"},{n:9,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3.2,stem:[],opts:["고대 그리스 조각은 사실주의 예술의 정점을 보여 준다.","추상 미술은 대중에게 이해되기 어렵다는 한계가 있다.","예술 작품의 가치는 제작 기법의 숙련도로 결정된다.","시대가 달라져도 예술이 추구하는 목적은 변하지 않는다.","예술을 현실의 모방으로만 규정하는 것은 충분하지 않다."],answer:5,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["The ancient Greeks felt that the visual artist’s goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis—simple copying—does not sufficiently define art."]},expl:"",type:"요지"},{n:10,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3.2,stem:[],opts:["training methods that prevent common running injuries","why our bodies know more about running than our minds do","how supercomputers simulate complex human movement","the history of long-distance running competitions","reasons running is better exercise than walking"],answer:2,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our w
