lgorithms and remembering that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing.","* nudge: 가볍게 자극하다"]},expl:"architects → designers, agency → independence, past realities → the past.",type:"요약문 완성(3칸)"},{n:26,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:[],opts:["enjoy the taste of the meal","digest the virtual content","ignore the incoming messages","slow down our eating","organize the day’s schedule"],answer:2,passage:{title:"[26] 다음 글을 읽고 물음에 답하시오.",lines:["When we are ‘always on’ we are constantly ingesting content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is overloading us. As our will attempts to ________________________ its forces are diverted from the physical content, our food. It’s easy to eat a sandwich in a minute while talking on the phone. Some people are skilled at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and the beginnings of nervous indigestion. Eat your sandwich. Taste it. Let it go down. Then text.","* ingest: 섭취하다"]},expl:"의지가 가상의 내용을 소화하려 하면 음식(physical content)에서 힘이 분산됨.",type:"빈칸 추론"}],essays:[{n:27,q:"위 지문에 따르면, 전자레인지의 도입이 가져온 단기적 변화와 장기적 변화를 <조건>에 맞게 우리말로 쓰시오.",pts:4,area:"서술형",cond:"1. 두 가지를 모두 포함하여 한 문장으로 쓸 것 / 2. ‘반면에’ 또는 ‘그러나’를 사용해 대조를 드러낼 것",parts:[{label:"",ko:"",pts:4,answers:["전자레인지 도입으로 단기적으로는 조리 시간이 줄어 요리하는 사람의 부담이 감소한 반면에, 장기적으로는 가족이 함께 저녁을 먹는 일이 점점 줄어들었다."]}],prompt:[],stimulus:"",excerpt:"",model:"전자레인지 도입으로 단기적으로는 조리 시간이 줄어 요리하는 사람의 부담이 감소한 반면에, 장기적으로는 가족이 함께 저녁을 먹는 일이 점점 줄어들었다.",crit:[],scoring:["단기·장기 각 1.5점 + 대조 표현 1점 / 지정 표현(반면에·그러나) 미사용 −1 / 문항별 최저 점수는 0점"],passageRef:"[7~9]",ty m the physical content, our food. It’s easy to eat a sandwich in a minute while talking on the phone. Some people are ④ <u>skilled</u> at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and ⑤ <u>the beginnings of perfect digestion</u>. Eat your sandwich. Taste it. Let it go down. Then text.","* ingest: 섭취하다"]},expl:"서둘러 먹으면서 문자를 쓰면 소화 불량이 시작된다(nervous indigestion). perfect digestion은 반대.",type:"낱말"},{n:2,area:"독해",q:"윗글의 내용과 일치하지 않는 것은?",pts:2.3,stem:[],opts:["멀티태스킹은 가상의 내용을 소화하는 데 드는 힘을 줄여 준다.","‘always on’ 상태에서 우리는 끊임없이 콘텐츠를 섭취한다.","전화 통화를 하면서 1분 만에 샌드위치를 먹기는 쉽다.","두 가지를 동시에 잘 해내는 사람도 있다.","서둘러 쓴 문자는 오해를 낳아 추가 설명을 필요로 할 수 있다."],answer:1,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["When we are ‘always on’ we are constantly ① <u>ingesting</u> content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is ② <u>overloading</u> us. As our will attempts to digest the virtual content its forces are ③ <u>diverted</u> from the physical content, our food. It’s easy to eat a sandwich in a minute while talking on the phone. Some people are ④ <u>skilled</u> at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and ⑤ <u>the beginnings of perfect digestion</u>. Eat your sandwich. Taste it. Let it go down. Then text.","* ingest: 섭취하다"]},expl:"의지가 가상의 내용을 소화하려 하면 음식에 쓸 힘이 오히려 분산된다.",type:"내용 불일치"},{n:3,area:"독해",q:"윗글에서 필자가 주장하는 바로 가장 적절한 것은?",pts:2.3,stem:[],opts:["문자는 가능한 한 간결하게 작성해야 한다.","식사할 때는 온라인 활동을 멈추고 음식에 집중해야 한다.","멀티태스킹 능력을 훈련으로 길러야 한다.","식사 시간을 규칙적으로 유지해야 한다.","소화를 위해 식후 가벼운 운동을 해야 한다."],answer:2,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["When we are ‘always on’ we are constantly ① <u>ingesting</u> content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is ② <u>overloading</u> us. As our will attempts to digest the virtual content its forces are ③ <u>diverted</u> from the physical content, our food. It’s easy to eat a sandwich in a minute while talking on the phone. Some people are ④ <u>skilled</u> at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and ⑤ <u>the beginnings of perfect digestion</u>. Eat your sandwich. Taste it. Let it go down. Then text.","* ingest: 섭취하다"]},expl:"Eat your sandwich. Taste it. Let it go down. Then text.",type:"주장"},{n:4,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3.3,stem:["Handling online content while eating (A) the attention our body needs for a meal, so we should finish the food first and (B) our replies until afterwards."],opts:["drains …… delay","drains …… shorten","sharpens …… delay","divides …… repeat","wastes …… shorten"],answer:1,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:["When we are ‘always on’ we are constantly ① <u>ingesting</u> content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is ② <u>overloading</u> us. As our will attempts to digest the virtual content its forces are ③ <u>diverted</u> from the physical content, our food. It’s easy to eat a sandwich in a minute while talking on the phone. Some people are ④ <u>skilled</u> at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and ⑤ <u>the beginnings of perfect digestion</u>. Eat your sandwich. Taste it. Let it go down. Then text.","* ingest: 섭취하다"]},expl:"forces are diverted → drains, Eat … Then text → delay.",type:"요약문 완성"},{n:5,area:"독해",q:"다음 글에서 전체 흐름과 관계 없는 문장은?",pts:2,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:["Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself. Most of the time, however, we want something more to happen. ① There needs to be a process that creates tension and drives the movement towards something in particular. ② The excitement that arises in this process creates satisfaction and pleasure. ③ This is seen in the measureless prelude as well. ④ Most concert halls today are designed to reduce echo rather than to increase it. ⑤ But there the tension might be caused by the ambiguity of the rhythm. Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm. This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece.","* prelude: 전주곡 ** ambiguity: 모호함 *** modulation: (음악의) 전조"]},expl:"공연장 음향 설계는 음악의 긴장·해소 논의와 무관.",type:"무관 문장"},{n:6,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.9,stem:[],opts:["Ten Rules for Finishing a Meeting on Time","Meetings That Branch Out: Working in Flexible-Time Cultures","Why Agendas Should Never Be Changed","The Manager Who Talks the Most Wins","Evergreen Forests and the People Who Protect Them"],answer:2,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be circulated before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a linear manner. What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary."]},expl:"유연한 시간 문화의 회의는 상록수처럼 예측 불가능하게 뻗어 나가며, 관리자는 그 변화를 활용해야 한다.",type:"제목"},{n:7,area:"독해",q:"윗글의 내용과 일치하는 것은?",pts:2,stem:[],opts:["회의 전에 시작 시각과 주제가 담긴 안건이 배포될 가능성이 크다.","유연한 시간 문화의 회의는 선형적으로 진행될 것으로 기대된다.","지난주에 정한 우선순위는 회의 당일에도 그대로 유지된다.","회의 중 걸려 오는 급한 전화는 금지되어 있다.","안건의 변경은 회의 실패의 신호로 여겨진다."],answer:1,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be circulated before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a linear manner. What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary."]},expl:"An agenda with a meeting start time and a topic will probably be circulated before the meeting.",type:"내용 일치"},{n:8,area:"독해",q:"윗글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:2,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process ① <u>essential</u> to consciousness. At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to ② <u>repair life energy</u> after significant loss. Grief work ③ <u>honours</u> the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. Psychotherapist Fran Weller describes grief work is “an act of ④ <u>indifference</u>, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains. In time this may build a desire to make good from the loss by repairing as many damages as we can and/or ⑤ <u>compensating</u> for them. Grief can make us both very sad and very motivated to act.","* transience: 덧없음"]},expl:"Weller는 애도 작업을 사랑과 연민에 뿌리를 둔 헌신(devotion)의 행위라고 했다. indifference는 반대.",type:"낱말"},{n:9,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.7,stem:[],opts:["why some people recover from loss faster than others","the psychological work grief does after a significant loss","the history of psychotherapy as a profession","how communities organize public mourning","the danger of expressing sadness in public"],answer:2,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process ① <u>essential</u> to consciousness. At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to ② <u>repair life energy</u> after significant loss. Grief work ③ <u>honours</u> the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. Psychotherapist Fran Weller describes grief work is “an act of ④ <u>indifference</u>, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains. In time this may build a desire to make good from the loss by repairing as many damages as we can and/or ⑤ <u>compensating</u> for them. Grief can make us both very sad and very motivated to act.","* transience: 덧없음"]},expl:"애도는 상실을 기리면서 자기 변화와 삶의 지속을 준비하는 역동적 과정.",type:"주제"},{n:10,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.3,stem:[],opts:["사람들은 함께 지낼 집단이 주는 공유된 의미를 통해 불확실성을 줄이려 한다.","대학은 기숙사 수용 인원을 정확히 예측해 배정해야 한다.","넓고 편안한 방이 학업 성취에 미치는 영향이 크다.","신입생에게는 개인 공간보다 학업 지도가 더 필요하다.","숙소 시설의 차이가 학생 간 갈등의 주된 원인이다."],answer:1,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["Of the cognitive motivations, the most fundamental one encourages people to understand their environment ① <u>to predict</u> what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are ② <u>shared with other people</u>. For example, if in a given year more people accept offers of admission than a college ③ <u>expects</u>, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, ④ <u>living in those hotels</u> is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally ⑤ <u>develops</u> from membership in a stable group.","* niche: 적소, 적당한 장소"]},expl:"호텔 거주가 문제인 이유는 시설이 아니라 안정된 집단이 주는 공유된 사회적 이해의 부재.",type:"요지"},{n:11,area:"독해",q:"윗글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:3,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오.",lines:["Of the cognitive motivations, the most fundamental one encourages people to understand their environment ① <u>to predict</u> what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are ② <u>shared with other people</u>. For example, if in a given year more people accept offers of admission than a college ③ <u>expects</u>, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, ④ <u>living in those hotels</u> is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally ⑤ <u>develops</u> from membership in a stable group.","* niche: 적소, 적당한 장소"]},expl:"분사구 developed from membership가 옳음(주어·동사 중복 불가).",type:"어법"},{n:12,area:"독해",q:"윗글의 내용과 일치하지 않는 것은?",pts:2.7,stem:[],opts:["밀도는 물리적 측정치이고 혼잡감은 심리적 느낌이다.","모든 심리학자는 밀집을 언제나 부정적인 것으로 본다.","혼잡감은 감각 과부하와 통제력 상실을 일으킬 수 있다.","공격적인 집단은 밀도가 높아지면 폭력적으로 변할 수 있다.","공원과 보행자 구역은 전반적인 기분을 끌어올리는 데 도움이 될 수 있다."],answer:2,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오.",lines:["Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety. However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors __________________________. So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance. But if they are dreading an event, crowding will make the person’s experience of it even worse. Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises. Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.","* accentuate: 두드러지게 하다 ** defuse: 완화하다"]},expl:"일부 심리학자는 혼잡을 중립적으로 보며 기존의 기분이 강화된다고 본다.",type:"내용 불일치"},{n:13,area:"독해",q:"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:2.7,stem:[],opts:["disappear when spaces become crowded","remain the same regardless of density","become harder to predict in open spaces","intensify as density increases","depend mostly on the weather"],answer:4,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:["Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety. However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors __________________________. So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance. But if they are dreading an event, crowding will make the person’s experience of it even worse. Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises. Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.","* accentuate: 두드러지게 하다 ** defuse: 완화하다"]},expl:"밀도가 높아질수록 기존의 기분·행동이 강화된다는 중립적 관점.",type:"빈칸 추론"},{n:14,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:2.7,stem:[],opts:["글에 대한 피드백은 비판적 통찰을 줄 수 있는 사람에게 받아야 한다.","초고 단계부터 가까운 사람들에게 자주 보여 주어야 한다.","동료 작가의 의견은 언제나 가장 정확하다.","합평 모임에 참여하면 글쓰기 실력이 저절로 향상된다.","완성도가 낮은 글은 절대 공개해서는 안 된다."],answer:1,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오.",lines:["Only when you’re happy that you’ve done the ① <u>best you can</u> for your story should you show it to someone else. You may well want to show it to your ② <u>nearest and dearest</u>, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. ③ <u>The least valuable feedback</u> is likely to come from other sources: you should choose readers for their ④ <u>critical insight</u>, not their closeness to you. Fellow writers are ideal, but don’t imagine that any writer will do. If you are part of a writers’ circle or class, you’ll know whose writing you ⑤ <u>admire</u>, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not."]},expl:"choose readers for their critical insight, not their closeness to you.",type:"요지"},{n:15,area:"독해",q:"윗글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:2.7,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오.",lines:["Only when you’re happy that you’ve done the ① <u>best you can</u> for your story should you show it to someone else. You may well want to show it to your ② <u>nearest and dearest</u>, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. ③ <u>The least valuable feedback</u> is likely to come from other sources: you should choose readers for their ④ <u>critical insight</u>, not their closeness to you. Fellow writers are ideal, but don’t imagine that any writer will do. If you are part of a writers’ circle or class, you’ll know whose writing you ⑤ <u>admire</u>, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not."]},expl:"가장 가치 있는(most valuable) 피드백이 다른 출처에서 온다는 문맥.",type:"낱말"},{n:16,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.7,stem:[],opts:["Why Wages Can Never Be Frozen","Cheap Natures: The Invisible Ground Capitalism Stands On","Populism and the Failure of Democracy","Climate Change and the Future of Farming","Cash Is Everywhere: The Truth About Markets"],answer:2,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:["Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes burn through an island, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where ____________________________ ― and the cheap work of humans and other natures can be forcefully taken.","* cash nexus: 현금 거래 관계"]},expl:"자본주의는 값싼 자연·노동에 의존하며, 그것이 비싸지면 새 frontier를 찾는다.",type:"제목"},{n:17,area:"독해",q:"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3,stem:[],opts:["workers can finally demand higher wages","the climate returns to its earlier state","the new cheap things can be seized","cash exchange disappears completely","protests can be safely ignored"],answer:3,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오.",lines:["Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes burn through an island, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where ____________________________ ― and the cheap work of humans and other natures can be forcefully taken.","* cash nexus: 현금 거래 관계"]},expl:"노동·에너지·작물이 더는 싸지 않게 되면 새로 값싼 것을 확보할 수 있는 frontier가 중요해진다.",type:"빈칸 추론"},{n:18,area:"독해",q:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오.",lines:["Progressive educators and librarians are developing curricula to teach what we might call attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site is ① <u>deliberately designed</u> to distract or provoke them. Classes in media literacy traditionally cover how to evaluate the ② <u>credibility</u> of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise ③ <u>self-awareness</u> about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use ④ <u>infinite scrolling</u> instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more ⑤ <u>passive users</u> rather than passive consumers."]},expl:"의도된 설계로 인식하게 함으로써 학생들이 수동적 소비자가 아닌 비판적(critical) 사용자가 된다.",type:"낱말"},{n:19,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3,stem:[],opts:["silent and formal","playful and creative","slow and careful","direct and explicit","loud and emotional"],answer:4,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, ______________________ in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* per se: 그 자체로"]},expl:"absolutely, certainly 같은 단정적 어휘가 개인주의 문화의 직접적·명시적 방식을 보여 줌.",type:"빈칸 추론"},{n:20,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:3,stem:["Human geography is becoming unclear. As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly.","(A) Instead, the complexity of today’s world makes it increasingly difficult to settle permanently anywhere. Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of quantum people.","(B) It would be nice to return to some form of stability, but that’s not how things work in a quantum world.","(C) One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux."],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:5,passage:{title:"[20] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, ______________________ in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* quantum physics: 양자 물리학 ** velocity: 속도 *** flux: 끊임없는 변화"]},expl:"이동이 일상이 된 상황과 상태 변화 비유 → 양자 입자 비유 → 안정 복귀는 불가능 → 그래서 정착이 어려운 quantum people.",type:"글의 순서"},{n:21,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:2.7,stem:["Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations. Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years.","(A) However, faster wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations.","(B) For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly.","(C) When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin. The digital twin becomes a real-time accurate copy of a physical object’s properties and states."],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:1,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, ______________________ in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* replica: 복제본 ** downtime: 비가동 시간"]},expl:"디지털 트윈의 정의와 역사 → However 실시간 데이터의 효과 → 센서 갱신으로 실시간 복제가 됨 → For instance 고가 자산 사례.",type:"글의 순서"},{n:22,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3,stem:["People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance."],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they feel licensed to do so since they morally account the “eco-friendly” choice as a “good” deed. ( ① ) Moral licensing has also been observed in the context of cooperation for the good of the environment. ( ② ) When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” ( ③ ) In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. ( ④ ) In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. ( ⑤ ) For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"eco-guilt를 느낄 수 있다는 문장 뒤에 그 보상 행동이 오고, 다음 문장의 such a balance가 이를 받음.",type:"문장 삽입"},{n:23,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3,stem:["However, individuals may be faced with more exclusion when they cannot adapt to a group."],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오.",lines:["Exclusion is a state that is ignored by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. ( ① ) Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened. ( ② ) Positive social behaviors develop belonging and self-respect. ( ③ ) The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases. ( ④ ) When excluded individuals grow away from communication and social activities, their contribution to the organization they are in may decrease. ( ⑤ ) When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way. Precautions need to be taken regarding organizational exclusion, which is very important for business."]},expl:"적응하면 배제 가능성이 줄어든다는 문장 뒤에 However로 반대 경우가 오고, 이어서 그 결과가 서술됨.",type:"문장 삽입"},{n:24,area:"독해",q:"밑줄 친 the easier pickings가 다음 글에서 의미하는 바로 가장 적절한 것은?",pts:3.3,stem:[],opts:["branches that are safer for building nests","food that can be gathered with less effort","trees that grow faster than their neighbors","territories that no other bird has claimed","weather conditions that favor long flights"],answer:2,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오.",lines:["The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers <u>the easier pickings</u>. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.","* forage: 먹이를 찾아다니다 ** spruce: 가문비나무"]},expl:"새끼에게 먹이가 필요해지는 시기에 red spruce 숲이 먹이를 더 쉽게 구할 수 있게 해 준다는 뜻.",type:"함축"},{n:25,area:"독해",q:"다음 글에서 전체 흐름과 관계 없는 문장은?",pts:2.7,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[25] 다음 글을 읽고 물음에 답하시오.",lines:["Our adult brains retain a preference for perpetuating good, fair behavior. ① Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. ② In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. ③ College students, on the other hand, tend to spend most of their monthly budget on food and transportation. ④ In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. ⑤ In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake.","* perpetuate: 영속시키다"]},expl:"대학생의 소비 지출 항목은 선행 기억과 기부 행동이라는 흐름과 무관.",type:"무관 문장"},{n:26,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.7,stem:[],opts:["The Microwave Oven: A Story of Engineering Genius","How to Prepare a Feast in Minutes","Convenience Gained, Family Dinners Lost","Women and the Kitchen: A Changing History","Why Special Occasions Still Matter"],answer:3,passage:{title:"[26] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more (a) <u>subtle</u> aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and (b) <u>revolutionized</u> food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was (c) <u>discouraging</u> for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to (d) <u>overlook</u> the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became (e) <u>a luxury of the past</u>, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"편리함의 이면에 가족 식사의 소멸이라는 장기적 결과.",type:"제목(장문)"},{n:27,area:"독해",q:"밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[27] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more (a) <u>subtle</u> aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and (b) <u>revolutionized</u> food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was (c) <u>discouraging</u> for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to (d) <u>overlook</u> the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became (e) <u>a luxury of the past</u>, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"조리 시간 단축은 요리하는 사람에게 해방감을 주었다(liberating). discouraging은 반대.",type:"낱말(장문)"},{n:28,area:"독해",q:"밑줄 친 부분 중, 어법상 틀린 것은?",pts:2.5,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[28] 다음 글을 읽고 물음에 답하시오.",lines:["The concept of “choice architecture,” ① <u>popularized</u> in behavioral economics, highlights how the design of the environment in which choices ② <u>are made</u> can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended, and what options are ③ <u>presented</u> to us, they subtly, and sometimes not so subtly, nudge us towards particular paths. While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects ④ <u>are not aligned</u> with the well-being or autonomy of the individual. The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world? It requires a conscious effort to maintain critical engagement with the technologies we use. It means actively seeking out diverse perspectives, questioning algorithmic recommendations, and making deliberate choices that go against the predicted grain. It involves cultivating a healthy skepticism towards the seemingly objective outputs of algorithms and ⑤ <u>remember</u> that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing.","* nudge: 가볍게 자극하다"]},expl:"cultivating과 병렬을 이루는 동명사 remembering이 옳음.",type:"어법(장문)"},{n:29,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.3,stem:[],opts:["technical limits of recommendation algorithms","the history of behavioral economics","how companies profit from healthier habits","protecting human agency against algorithmic choice architecture","why objective data should guide all decisions"],answer:4,passage:{title:"[29] 다음 글을 읽고 물음에 답하시오.",lines:["The concept of “choice architecture,” ① <u>popularized</u> in behavioral economics, highlights how the design of the environment in which choices ② <u>are made</u> can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended,
