s, they have perfected an agricultural civilization."]},expl:"",type:"제목"},{n:16,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["methods of raising self-esteem in early childhood","the danger of relying too much on others’ opinions","how the brain stores memories of social rejection","self-esteem as a system that monitors our social acceptance","why conscious thinking slows down social judgment"],answer:4,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:['From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. <u class="g">The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.</u> When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.']},expl:"",type:"주제"}],essays:[{n:17,q:"다음은 윗글의 일부이다. 밑줄 친 ①~⑤ 중 <b>어법상 틀린 것 2개</b>를 찾아 기호를 쓰고 바르게 고쳐 쓰시오.",pts:5,area:"서술형",cond:"기호와 고친 형태를 함께 쓸 것 / 한 단어로만 고칠 것",parts:[{label:"",ko:"",pts:5,answers:["① can be discouraged → can discourage / ④ are → is"]}],prompt:[],stimulus:"",excerpt:"Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type ① <u>can be discouraged</u> a reader from even ② <u>starting</u> to read. You may think such frequent paragraphing will damage the development of your point. Don’t worry; the gains far ③ <u>outweigh</u> the hazards. But don’t go too far. A succession of tiny paragraphs ④ <u>are</u> as annoying as a paragraph that’s too long. Actually they make the reader’s job ⑤ <u>harder</u> by chopping up a natural train of thought.",model:"① can be discouraged → can discourage / ④ are → is",crit:[],scoring:["①은 뒤에 목적어 a reader가 있으므로 능동태(can discourage). ④의 주어는 단수 A succession(of 뒤 복수명사에 끌리지 말 것). ②는 from 뒤 동명사, ③은 복수주어 the gains와 수 일치, ⑤는 make+목적어+형용사(비교급)로 모두 옳음."],passageRef:"6번 지문",type:"어법 고치기"},{n:18,q:"윗글의 밑줄 친 문장과 같은 뜻이 되도록, 다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"There is로 시작할 것 / between A and B 구문을 사용할 것 / plan, come to fruition을 알맞은 형태로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["There is a difference between planning and thinking all your plans have to come to fruition."]}],prompt:[],stimulus:"계획을 세우는 것과 당신의 모든 계획이 반드시 실현되어야 한다고 생각하는 것 사이에는 차이가 있다.",excerpt:"",model:"There is a difference between planning and thinking all your plans have to come to fruition.",crit:[],scoring:["between 뒤 두 항목을 모두 동명사로 병렬시켰는지에 배점."],passageRef:"4번 지문",type:"밑줄 영작"},{n:19,q:"다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"현재진행 수동태를 사용할 것 / held, captive, devices를 어형 변화 없이 사용할 것 / 총 14단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["Many kids today are being held captive by ‘smart’ devices like phones and tablets."]}],prompt:[],stimulus:"오늘날 많은 아이들이 휴대전화와 태블릿 같은 ‘스마트’ 기기에 사로잡혀 있다.",excerpt:"",model:"Many kids today are being held captive by ‘smart’ devices like phones and tablets.",crit:[],scoring:["are being held(진행 수동) 정확성에 배점."],passageRef:"1번 지문",type:"조건 영작"},{n:20,q:"윗글의 주제를 <조건>에 맞게 한 문장의 영어로 쓰시오.",pts:5,area:"서술형",cond:"To attract로 시작할 것 / belief, match(또는 fit)를 반드시 포함할 것 / 12~18단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["To attract what you want, you must first hold a belief system that matches your desires."]}],prompt:[],stimulus:"— 필자가 가장 강력한 요인이라고 말한 것이 무엇인지 드러나도록 쓸 것",excerpt:"",model:"To attract what you want, you must first hold a belief system that matches your desires.",crit:[],scoring:["belief system이 가장 강력한 attractor라는 핵심이 드러나면 정답 처리."],passageRef:"2번 지문",type:"주제문 영작"}]},g2_sunyeo:{id:"g2_sunyeo",title:"고2 순여고 · 1회차 (모의고사)",grade:"고2",school:"순여고",round:1,minutes:70,scope:"2026학년도 9월 고2 전국연합학력평가 20~24, 29~42번 (18개 독해 지문)",mcq:[{n:1,area:"독해",q:"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:2.8,stem:[],opts:["critical insight","emotional support","writing experience","personal loyalty","popular taste"],answer:1,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["Only when you’re happy that you’ve done the best you can for your story should you show it to someone else. You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. The most valuable feedback is likely to come from other sources: you should choose readers for their ______________________, not their closeness to you. Fellow writers are ideal, but don’t imagine that any writer will do. If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not."]},expl:"피드백 제공자는 친밀함이 아니라 비판적 통찰(critical insight)을 기준으로 골라야 한다는 문맥.",type:"빈칸 추론"},{n:2,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3.4,stem:[],opts:["how to choose the right readers for feedback on your writing","why family members make the most honest critics","the best moment to begin writing a new story","rules for running a successful writers’ circle","ways to improve a draft without outside help"],answer:1,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["Only when you’re happy that you’ve done the best you can for your story should you show it to someone else. You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. The most valuable feedback is likely to come from other sources: you should choose readers for their ______________________, not their closeness to you. Fellow writers are ideal, but don’t imagine that any writer will do. If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not."]},expl:"누구에게 피드백을 받을 것인가 — 친밀함이 아니라 비판적 통찰이 기준.",type:"주제"},{n:3,area:"독해",q:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:2.9,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["When we are ‘always on’ we are constantly ① <u>ingesting</u> content ― reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is overloading us. As our will attempts to digest the virtual content its forces ② <u>are diverted</u> from the physical content, our food. It’s easy to eat a sandwich in a minute while ③ <u>talking</u> on the phone. Some people are skilled at ④ <u>doing</u> both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and the beginnings of nervous indigestion. Eat your sandwich. Taste it. Let it ⑤ <u>goes down</u>. Then text.","* ingest: 섭취하다"]},expl:"사역동사 let + 목적어 + 동사원형 → go down이 옳음.",type:"어법"},{n:4,area:"독해",q:"윗글의 내용과 일치하는 것은?",pts:2.8,stem:[],opts:["생물학적 성공은 태어난 새끼의 수만으로 측정된다.","동물은 현재의 필요만을 기준으로 서식지를 고른다.","black-throated green warbler는 북아메리카 서부의 가문비나무 숲에 둥지를 튼다.","새끼가 먹이를 필요로 할 때는 white spruce 숲에서 먹이를 더 쉽게 얻는다.","초여름에 red spruce는 이웃한 white spruce보다 먹이가 적다."],answer:5,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:["The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to ________________________________. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.","* forage: 먹이를 찾아다니다 ** spruce: 가문비나무"]},expl:"even though these trees offer less food than the neighboring white spruce trees와 일치.",type:"내용 일치"},{n:5,area:"독해",q:"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:[],opts:["judge in advance which place will suit them later","recall the exact spot where they were born","imitate the choices of neighboring species","avoid any area that another animal has used","count the amount of food available each day"],answer:1,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:["The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to ________________________________. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.","* forage: 먹이를 찾아다니다 ** spruce: 가문비나무"]},expl:"warbler가 현재보다 미래의 양육 필요에 맞는 장소를 고른다는 예시가 뒤따름.",type:"빈칸 추론"},{n:6,area:"독해",q:"다음 글의 요지로 가장 적절한 것은?",pts:2.9,stem:[],opts:["전자레인지는 여성의 가사 노동 시간을 획기적으로 줄였다.","새로운 매체의 장기적인 영향은 눈에 잘 띄지 않지만 서서히 축적된다.","가족이 함께 식사하는 습관은 건강한 생활의 기초가 된다.","새로운 기술은 도입 초기에 그 편리함을 충분히 인정받지 못한다.","음식 준비 시간이 긴 요리는 특별한 날에만 즐겨야 한다."],answer:2,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became a luxury of the past, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"첫 문장(we miss the changes that accumulate over time but are not apparent day to day)이 요지.",type:"요지"},{n:7,area:"독해",q:"밑줄 친 quantum people이 윗글에서 의미하는 바로 가장 적절한 것은?",pts:3.2,stem:[],opts:["scientists who study the movement of tiny particles","workers who stay in their hometowns for their whole lives","wealthy travelers who prefer luxury over stability","people whose locations keep changing and who struggle to settle permanently","citizens who demand a return to the old social order"],answer:4,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["Human geography is becoming unclear. As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly. One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux. It would be nice to return to some form of stability, but that’s not how things work in a quantum world. Instead, the complexity of today’s world makes it increasingly difficult to settle permanently anywhere. Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of <u>quantum people</u>.","* quantum physics: 양자 물리학 ** velocity: 속도 *** flux: 끊임없는 변화"]},expl:"양자 입자처럼 위치와 속도가 늘 변하는, 한곳에 정착하기 어려운 사람들.",type:"함의"},{n:8,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3.4,stem:[],opts:["Quantum Physics Made Simple for Everyone","The Return of Stability in Global Society","Passports, Privilege, and Power","Why Migrant Workers Stay in One Place","A World in Motion: Why Settling Down Keeps Getting Harder"],answer:5,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["Human geography is becoming unclear. As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly. One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux. It would be nice to return to some form of stability, but that’s not how things work in a quantum world. Instead, the complexity of today’s world makes it increasingly difficult to settle permanently anywhere. Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of <u>quantum people</u>.","* quantum physics: 양자 물리학 ** velocity: 속도 *** flux: 끊임없는 변화"]},expl:"이동이 일상이 되며 인간 지리가 흐릿해지고 영구 정착이 점점 어려워진다.",type:"제목"},{n:9,area:"독해",q:"다음 글에서 전체 흐름과 관계 없는 문장은?",pts:3.1,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety. ① However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors intensify as density increases. ② So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance. ③ Concert ticket prices, however, tend to rise sharply as the popularity of the performer increases. ④ But if they are dreading an event, crowding will make the person’s experience of it even worse. ⑤ Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises. Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.","* accentuate: 두드러지게 하다 ** defuse: 완화하다"]},expl:"공연 티켓 가격은 밀도·혼잡감 논의와 무관.",type:"무관 문장"},{n:10,area:"독해",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3.2,stem:["People are basically motivated to (A) what will happen in their environment, so students living in campus hotels feel uncomfortable not because of the facilities but because they do not (B) to a stable group that provides shared social meaning."],opts:["anticipate …… belong","control …… adapt","anticipate …… object","change …… belong","ignore …… adapt"],answer:1,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are shared with other people. For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally developed from membership in a stable group.","* niche: 적소, 적당한 장소"]},expl:"predict → anticipate, not a part of a stable group → do not belong.",type:"요약문 완성"},{n:11,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:3.1,stem:["Progressive educators and librarians are developing curricula to teach what we might call attention literacy.","(A) Classes in media literacy traditionally cover how to evaluate the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation.","(B) This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them.","(C) Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers."],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:2,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오.",lines:["Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are shared with other people. For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally developed from membership in a stable group."]},expl:"attention literacy 정의 → This means(구체화) → Classes/A student(수업 사례) → Another lesson(앱 설계 분석).",type:"글의 순서"},{n:12,area:"독해",q:"윗글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:3.3,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after ① <u>purchasing</u> “eco-friendly” products, probably because they feel licensed to do so since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been ② <u>observed</u> in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know ③ <u>was harmful</u> to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes ④ <u>to reduce</u> inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition ⑤ <u>addressing</u> environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"관계절 that의 선행사가 복수 deeds이므로 were가 옳음(they know는 삽입절).",type:"어법"},{n:13,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3.9,stem:["A green purchase can make people feel (A) to behave badly later, while the guilt left by harmful acts pushes them to look for the (B) way back to a clear conscience."],opts:["entitled …… longest","ashamed …… quickest","entitled …… quickest","forced …… safest","eager …… longest"],answer:3,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after ① <u>purchasing</u> “eco-friendly” products, probably because they feel licensed to do so since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been ② <u>observed</u> in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know ③ <u>was harmful</u> to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes ④ <u>to reduce</u> inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition ⑤ <u>addressing</u> environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"feel licensed → feel entitled, as quickly and easily as possible → the quickest way.",type:"요약문 완성"},{n:14,area:"독해",q:"윗글의 내용과 일치하지 않는 것은?",pts:3.3,stem:[],opts:["자신을 선행을 하는 사람으로 인식하는 것은 더 큰 선행의 동기가 된다.","연구 참가자는 100명의 대학생이었다.","과거의 선행을 적은 집단의 평균 기부액은 연구에서 얻은 수입의 절반을 넘었다.","나쁜 행동을 떠올린 참가자들이 선행을 떠올린 참가자들보다 두 배 가까이 더 기부했다.","타인의 반응까지 묘사한 참가자들은 행동 자체에만 집중한 참가자들보다 기부액이 적었다."],answer:4,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오.",lines:["Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake.","* perpetuate: 영속시키다"]},expl:"선행을 떠올린 집단이 나쁜 행동을 떠올린 집단보다 거의 두 배를 기부함(반대).",type:"내용 불일치"},{n:15,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3.8,stem:[],opts:["Charity Work: A Hidden Burden on Students","Paying Students to Be Generous","Bad Memories Are Stronger Than Good Ones","How Audiences Change an Actor’s Performance","Good Deeds Grow: Why Recalling Kindness Makes Us Kinder"],answer:5,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오.",lines:["Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake.","* perpetuate: 영속시키다"]},expl:"과거의 선행을 떠올린 사람이 더 많이 기부했고, 외양보다 행위 자체를 중시할수록 관대했다.",type:"제목"},{n:16,area:"독해",q:"밑줄 친 go against the predicted grain이 다음 글에서 의미하는 바로 가장 적절한 것은?",pts:3.4,stem:[],opts:["choosing what algorithms would not expect us to choose","accepting the most popular recommendations without doubt","predicting future trends more accurately than machines","following the paths designed by human architects","refusing to use any digital technology at all"],answer:1,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:["The concept of “choice architecture,” popularized in behavioral economics, highlights how the design of the environment in which choices are made can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended, and what options are presented to us, they subtly, and sometimes not so subtly, nudge us towards particular paths. While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects are not aligned with the well-being or autonomy of the individual. The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world? It requires a conscious effort to maintain critical engagement with the technologies we use. It means actively seeking out diverse perspectives, questioning algorithmic recommendations, and making deliberate choices that <u>go against the predicted grain</u>. It involves cultivating a healthy skepticism towards the seemingly objective outputs of algorithms and remembering that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing.","* nudge: 가볍게 자극하다"]},expl:"알고리즘이 예측한 방향과 반대되는 의도적 선택을 하는 것.",type:"함의"},{n:17,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3.3,stem:["There needs to be a process that creates tension and drives the movement towards something in particular."],opts:["①","②","③","④","⑤"],answer:2,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오.",lines:["Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself. ( ① ) Most of the time, however, we want something more to happen. ( ② ) The excitement that arises in this process creates satisfaction and pleasure. ( ③ ) This is seen in the measureless prelude as well. ( ④ ) But there the tension might be caused by the ambiguity of the rhythm. ( ⑤ ) Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm. This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece.","* prelude: 전주곡 ** ambiguity: 모호함 *** modulation: (음악의) 전조"]},expl:"“something more to happen” 뒤에서 그 과정(process)을 제시하고, 다음 문장의 this process가 이를 받음.",type:"문장 삽입"},{n:18,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:["In flexible-time cultures, a meeting begins with a shared agenda but (A) freely from it, so a good manager treats interruptions and changes not as disruptions but as (B) parts of a productive meeting."],opts:["departs …… harmful","departs …… normal","suffers …… normal","benefits …… unusual","withdraws …… formal"],answer:2,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be ① <u>circulated</u> before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a ② <u>linear</u> manner. What seemed like a priority last week when the agenda was crafted is not ③ <u>necessarily</u> the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in ④ <u>predictable</u> ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as ⑤ <u>natural</u> and necessary."]},expl:"branch off in a new direction → departs, natural and necessary → normal.",type:"요약문 완성"},{n:19,area:"독해",q:"윗글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3.7,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be ① <u>circulated</u> before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a ② <u>linear</u> manner. What seemed like a priority last week when the agenda was crafted is not ③ <u>necessarily</u> the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in ④ <u>predictable</u> ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as ⑤ <u>natural</u> and necessary."]},expl:"유연한 시간 문화의 회의는 예측 불가능한(unpredictable) 방향으로 자라난다는 문맥.",type:"어휘"},{n:20,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:3.4,stem:["Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness.","(A) In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. Grief can make us both very sad and very motivated to act.","(B) At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss. Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life.","(C) Psychotherapist Fran Weller describes grief work is “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains."],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:3,passage:{title:"[20] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be ① <u>circulated</u> before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a ② <u>linear</u> manner. What seemed like a priority last week when the agenda was crafted is not ③ <u>necessarily</u> the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in ④ <u>predictable</u> ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as ⑤ <u>natural</u> and necessary.","* transience: 덧없음"]},expl:"애도의 중요성 → 심리적 기능과 애도 작업의 의미 → Weller의 정의 인용 → 남은 것에 대한 사랑의 강화와 회복 의지.",type:"글의 순서"},{n:21,area:"독해",q:"다음 글에서 전체 흐름과 관계 없는 문장은?",pts:3.3,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오.",lines:["Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. ① Reproducing life within the cash nexus is expensive, and it grows more expensive over time. ② Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. ③ Workers demand dignity, and their labor becomes expensive. ④ Some economists argue that raising the minimum wage reduces the number of available jobs. ⑤ Production processes burn through an island, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where the new cheap things can be seized ― and the cheap work of humans and other natures can be forcefully taken.","* cash nexus: 현금 거래 관계"]},expl:"최저임금과 일자리 수 논쟁은 “값싼 자연/노동의 고갈” 흐름과 무관.",type:"무관 문장"},{n:22,area:"독해",q:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3.4,stem:[],opts:["①","②","③","④","⑤"],answer:2,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오.",lines:["Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations. Digital twins are ① <u>not new</u>; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years. However, ② <u>slower</u> wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations. When sensors collect data from a connected device, the sensor data can be used to ③ <u>continuously</u> update the digital twin. The digital twin becomes a real-time ④ <u>accurate</u> copy of a physical object’s properties and states. For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very ⑤ <u>costly</u>.","* replica: 복제본 ** downtime: 비가동 시간"]},expl:"더 빠른(faster) 무선망이 실시간 데이터를 가능하게 함. slower는 반대.",type:"어휘"},{n:23,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3.7,stem:["By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably."],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. ( ① ) They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures. ( ② ) Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. ( ③ ) The English language is the only language in the world that spells I with a capital letter. ( ④ ) This phenomenon may reflect the fact that the roots of individualism are in England. ( ⑤ ) There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* per se: 그 자체로"]},expl:"직접적 어휘(absolutely 등) 예시 뒤에 By contrast로 집단주의 문화의 모호한 어휘가 이어짐.",type:"문장 삽입"},{n:24,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3.9,stem:[],opts:["receive stronger support from their colleagues","take on additional responsibilities at work","adapt successfully to positive social behaviors","grow away from communication and social activities","are rewarded for their loyalty to the group"],answer:4,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오.",lines:["Exclusion is a state that is ignored by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened. Positive social behaviors develop belonging and self-respect. The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases. However, individuals may be faced with more exclusion when they cannot adapt to a group. When excluded individuals ______________________________, their contribution to the organization they are in may decrease. When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way. Precautions need to be taken regarding organizational exclusion, which is very important for business."]},expl:"배제된 개인이 소통·사회 활동에서 멀어질 때 조직 기여도가 감소함.",type:"빈칸 추론"}],essays:[{n:25,q:"위 지문의 요지를 <조건>에 맞게 한 문장의 영어로 쓰시오.",pts:6,area:"서술형",cond:"1. 분사구문을 포함할 것 / 2. notice, obvious, slowly를 모두 사용할 것(어형 변화 가능) / 3. 본문의 연속된 5단어 이상을 그대로 인용하지 말 것 / 4. 주어와 동사를 갖춘 완전한 문장으로 쓸 것",parts:[{label:"",ko:"",pts:6,answers:["Noticing only the obvious benefits of a new technology, we fail to see the changes that slowly reshape our daily lives."]}],prompt:[],stimulus:"",excerpt:"",model:"Noticing only the obvious benefits of a new technology, we fail to see the changes that slowly reshape our daily lives.",crit:[],scoring:["분사구문 누락 −2 / 지정 어휘 누락 각 −1 / 연속 5단어 인용 −2 / 요지 불일치 0점 / 문항별 최저 점수는 0점"],passageRef:"6번",type:"요지 조건영작(분사구문)"},{n:26,q:"위 지문에서 캠퍼스 호텔에 사는 것이 문제가 되는 이유를 <조건>에 맞게 영어로 쓰시오.",pts:4,area:"서술형",cond:"1. Because로 시작할 것 / 2. stable, group, uncertain을 모두 사용할 것(어형 변화 가능) / 3. 15단어 이상으로 쓰되 본문의 연속된 5단어 이상을 그대로 인용하지 말 것",parts:[{label:"",ko:"",pts:4,answers:["Because hotel residents do not belong to a stable group of neighbors, they remain uncertain about where they fit socially."]}],prompt:[],stimulus:"",excerpt:"",model:"Because hotel residents do not belong to a stable group of neighbors, they remain uncertain about where they fit socially.",crit:[],scoring:["Because 미시작 −1 / 지정 어휘 누락 각 −1 / 15단어 미만 −1 / 연속 5단어 인용 −2 / 이유 불일치 0점 / 문항별 최저 점수는 0점"],passageRef:"10번",type:"이유 서술 영작"},{n:27,q:"위 지문의 내용에 근거하여 다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"1. because와 question을 반드시 사용할 것(어형 변화 가능) / 2. 수동태를 한 번 이상 포함할 것 / 3. 15단어 이상의 완전한 문장으로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["Because our digital surroundings are designed by algorithms, we should question what they recommend to us."]}],prompt:[],stimulus:"",excerpt:"",model:"Because our digital surroundings are designed by algorithms, we should question what they recommend to us.",crit:[],scoring:["수동태 누락 −2 / because·question 누락 각 −1 / 15단어 미만 −1 / 주어·동사 불완전 −1 / 의미 오류 −2 / 문항별 최저 점수는 0점"],passageRef:"16번",type:"조건 영작(수동태)"},{n:28,q:"위 지문의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 <보기>의 단어를 알맞은 형태로 바꿔 쓰시오.",pts:5,area:"서술형",cond:"1. <보기>의 단어를 각각 한 번씩 사용하되, 필요한 경우 어형을 바꿀 것 / 2. 빈칸 (A)는 형용사(부정 접두사 포함), (B)는 현재시제 동사로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["(A) unpredictable  (B) arise"]}],prompt:[],stimulus:"",excerpt:"",model:"(A) unpredictable  (B) arise",crit:[],scoring:["각 2.5점 / 품사·시제 불일치 0점 / 철자 오류 −1 / 문항별 최저 점수는 0점"],passageRef:"[18~19]",type:"요약문 영작(어형 변화)"}]},g2_maesan:{id:"g2_maesan",title:"고2 매여고 · 1회차 (모의고사)",grade:"고2",school:"매여고",round:1,minutes:70,scope:"2026학년도 9월 고2 전국연합학력평가 20~24, 29~42번 (18개 독해 지문)",mcq:[{n:1,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.8,stem:[],opts:["the need to prevent exclusion in organizations and its effects on performance","benefits of competition among employees","how to design office spaces for better communication","why psychologists prefer studying small groups","ways to reward loyal employees"],answer:1,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["Exclusion is a state that is ① <u>ignored</u> by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. Individuals react to organizational exclusion by trying to strengthen their basic needs, which are ② <u>threatened</u>. Positive social behaviors develop belonging and self-respect. The likelihood that individuals who try to adapt to positive social behaviors will experience ③ <u>organizational exclusion increases</u>. However, individuals may be faced with more exclusion when they cannot adapt to a group. When excluded individuals grow away from communication and social activities, their contribution to the organization they are in ④ <u>may decrease</u>. When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a ⑤ <u>negative</u> way. Precautions need to be taken regarding organizational exclusion, which is very important for business."]},expl:"조직 내 배제가 성과에 미치는 악영향과 예방 조치의 필요성.",type:"주제"},{n:2,area:"독해",q:"윗글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3,stem:[],opts:["①","②","③","④","⑤"],answer:3,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["Exclusion is a state that is ① <u>ignored</u> by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. Individuals react to organizational exclusion by trying to strengthen their basic needs, which are ② <u>threatened</u>. Positive social behaviors develop belonging and self-respect. The likelihood that individuals who try to adapt to positive social behaviors will experience ③ <u>organizational exclusion increases</u>. However, individuals may be faced with more exclusion when they cannot adapt to a group. When excluded individuals grow away from communication and social activities, their contribution to the organization they are in ④ <u>may decrease</u>. When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a ⑤ <u>negative</u> way. Precautions need to be taken regarding organizational exclusion, which is very important for business."]},expl:"긍정적 사회 행동에 적응하는 사람은 배제될 가능성이 줄어듦(decreases).",type:"어휘"},{n:3,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:2.8,stem:[],opts:["for public recognition","for its own sake","for financial reward","for future benefits","for their reputation"],answer:2,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good ____________________.","* perpetuate: 영속시키다"]},expl:"외양(appearances)에 신경 쓰는 사람과 대비되는, 선행 그 자체를 중시하는 사람.",type:"빈칸 추론"},{n:4,area:"독해",q:"<보기>에서 윗글의 내용에 부합하는 사례를 모두 고른 것은?",pts:3,stem:[],opts:["a, b, d","a, b","a, c, e","b, d, e","c, d, e"],answer:1,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they <u>feel licensed to do so</u> since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been observed in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"a: moral licensing, b: eco-guilt 보상 행동, d: 과거 행동에 대한 평가 변경. c·e는 본문과 무관.",type:"추론(보기)"},{n:5,area:"독해",q:"밑줄 친 feel licensed to do so가 윗글에서 의미하는 바로 가장 적절한 것은?",pts:3.4,stem:[],opts:["obtain official permission to sell green products","believe an earlier good act excuses a later bad one","feel forced to explain their shopping decisions","refuse to admit that they have done anything wrong","expect a reward for protecting the environment"],answer:2,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they <u>feel licensed to do so</u> since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been observed in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"친환경 선택을 “좋은 행동”으로 계산해 두고 그 뒤의 부정행위를 스스로 허용하는 것.",type:"밑줄 의미"},{n:6,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Eco-Friendly Products: A Path to Honest Living","Why Guilt Makes Us Give Up on the Environment","The Science of Signing Petitions","Quick Fixes That Actually Work","Moral Balance: How Green Choices and Eco-Guilt Shape Behavior"],answer:5,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they <u>feel licensed to do so</u> since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been observed in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are likely to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage.","* petition: 청원서"]},expl:"친환경 선택 후 부정행위, eco-guilt 보상 등 도덕적 면허 현상.",type:"제목"},{n:7,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Because we tend to notice only the (A) effects of a new technology, its (B) consequences, like the microwave’s effect on family meals, often go unnoticed until much later."],opts:["immediate …… gradual","immediate …… positive","negative …… gradual","hidden …… social","negative …… immediate"],answer:1,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became <u>a luxury of the past</u>, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"obvious/short-term → immediate, accumulate over time → gradual.",type:"요약문 완성"},{n:8,area:"독해",q:"밑줄 친 a luxury of the past가 윗글에서 의미하는 바로 가장 적절한 것은?",pts:3.4,stem:[],opts:["an expensive dish that only the rich could afford","something families rarely make time for any more","a cooking method that modern ovens cannot copy","a tradition that has recently become popular again","a skill that older cooks refused to pass down"],answer:2,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became <u>a luxury of the past</u>, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"오래 걸리는 요리는 특별한 날을 빼면 이제 좀처럼 하지 않게 되었다는 뜻.",type:"밑줄 의미"},{n:9,area:"독해",q:"윗글의 내용과 일치하지 않는 것은?",pts:2.8,stem:[],opts:["The microwave oven was introduced in the early 1980s.","Preparing an evening meal used to take one person most of an afternoon.","The long-term effects of the microwave were widely predicted at the time.","Most of the family cooks who benefited from faster preparation were women.","Over time, fewer families ate dinner together."],answer:3,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became <u>a luxury of the past</u>, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."]},expl:"전자레인지의 영향은 예상되지 않았고 예견하기 어려웠음.",type:"내용 불일치(영어)"},{n:10,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3,stem:["Fellow writers are ideal, but don’t imagine that any writer will do."],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["( ① ) Only when you’re happy that you’ve done the best you can for your story should you show it to someone else. ( ② ) You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. ( ③ ) The most valuable feedback is likely to come from other sources: you should choose readers for their critical insight, not their closeness to you. ( ④ ) If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not. ( ⑤ )"]},expl:"“다른 출처(other sources)에서 피드백을 구하라” 뒤에 동료 작가를 제시하고, 이어서 어떤 작가인지 구체화.",type:"문장 삽입"},{n:11,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:2.8,stem:[],opts:["Red Spruce vs. White Spruce: A Battle for Light","Songbirds in Danger: The Loss of Northern Forests","Feeding the Young: The Hardest Task in Nature","Why Territories Matter More Than Food","Choosing a Home for Tomorrow: How Animals Read the Future"],answer:5,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오.",lines:["The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.","* forage: 먹이를 찾아다니다 ** spruce: 가문비나무"]},expl:"동물은 현재의 먹이보다 미래의 양육 필요에 맞는 장소를 선택한다.",type:"제목"},{n:12,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:2.8,stem:[],opts:["animals’ ability to choose habitats that suit their future needs","competition between songbirds for limited nesting sites","the effect of forest loss on North American songbirds","how baby birds learn to find food on their own","differences between red spruce and white spruce trees"],answer:1,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오.",lines:["The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success ― measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones.","* forage: 먹이를 찾아다니다 ** spruce: 가문비나무"]},expl:"동물은 현재뿐 아니라 미래의 필요까지 내다보고 서식지를 고른다.",type:"주제"},{n:13,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:[],opts:["move through the agenda point by point","develop in directions no one has planned","finish within the time that was announced","keep outside interruptions to a minimum","depend on one experienced leader"],answer:2,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:["A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be circulated before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a linear manner. What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings __________________________, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary."]},expl:"상록수처럼 가지가 뻗어 나가듯 회의가 예측 불가능하게 진행된다는 문맥.",type:"빈칸 추론"},{n:14,area:"독해",q:"윗글의 내용과 일치하지 않는 것은?",pts:2.8,stem:[],opts:["Language is described as a manifestation of culture.","Children learn patterns of interaction rather than language in itself.","Japanese uses a single fixed word to refer to the self in every situation.","Words such as absolutely and certainly belong to the direct style.","English is said to be the only language that capitalizes the pronoun I."],answer:3,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* per se: 그 자체로"]},expl:"일본어는 상황·성별·나이 등에 따라 자신을 가리키는 말이 달라진다.",type:"내용 불일치(영어)"},{n:15,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Children acquire a way of communicating that (A) their culture, so that speakers from individualistic cultures use (B) words while those from collectivistic cultures prefer softer, more uncertain expressions."],opts:["mirrors …… polite","rejects …… definite","changes …… formal","mirrors …… definite","ignores …… vague"],answer:4,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오.",lines:["Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener.","* per se: 그 자체로"]},expl:"manifestation of culture → mirrors, categorical/direct → definite.",type:"요약문 완성"},{n:16,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Capitalism depends on (A) sources of labor and nature, and when these become costly, it must expand into new frontiers where such resources can be (B) once again."],opts:["inexpensive …… protected","abundant …… preserved","unlimited …… obtained","renewable …… shared","inexpensive …… obtained"],answer:5,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:["Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes <u>burn through an island</u>, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where the new cheap things can be seized ― and the cheap work of humans and other natures can be forcefully taken.","* cash nexus: 현금 거래 관계"]},expl:"cheap → inexpensive, seized/taken → obtained.",type:"요약문 완성"},{n:17,area:"독해",q:"밑줄 친 burn through an island가 윗글에서 의미하는 바로 가장 적절한 것은?",pts:3.4,stem:[],opts:["deplete the cheap resources of a region until they are no longer cheap","set fire to farmland to expand production","move factories to remote islands","isolate workers from the outside world","waste energy on unnecessary products"],answer:1,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오.",lines:["Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes <u>burn through an island</u>, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where the new cheap things can be seized ― and the cheap work of humans and other natures can be forcefully taken.","* cash nexus: 현금 거래 관계"]},expl:"island = 값싼 자연이 있는 지역; 생산이 그것을 소진하면 에너지가 더 이상 싸지 않음.",type:"밑줄 의미"},{n:18,area:"독해",q:"윗글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:3,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오.",lines:["Progressive educators and librarians are developing curricula to teach ① <u>what we might call</u> attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site ② <u>is deliberately designed</u> to distract or provoke them. Classes in media literacy traditionally cover ③ <u>how to evaluate</u> the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with ④ <u>track</u> how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often ⑤ <u>rooted</u> in psychology and profit motives), young people become more critical users rather than passive consumers."]},expl:"전치사 with 뒤에는 동명사 tracking이 와야 함.",type:"어법"},{n:19,area:"독해",q:"윗글의 내용과 일치하는 것은?",pts:3,stem:[],opts:["Attention literacy classes ignore the question of source credibility.","Students may be asked to count how often they check their phones while doing homework.","Media literacy has always included lessons on clickbait.","App design choices are described as accidental rather than intentional.","The goal is to make students passive consumers of media."],answer:2,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오.",lines:["Progressive educators and librarians are developing curricula to teach ① <u>what we might call</u> attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site ② <u>is deliberately designed</u> to distract or provoke them. Classes in media literacy traditionally cover ③ <u>how to evaluate</u> the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with ④ <u>track</u> how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often ⑤ <u>rooted</u> in psychology and profit motives), young people become more critical users rather than passive consumers."]},expl:"tracking how many times they … check their phone in an hour of homework.",type:"내용 일치(영어)"},{n:20,area:"독해",q:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:3.4,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[20] 다음 글을 읽고 물음에 답하시오.",lines:["Environmental psychologists make a distinction between the physical measurement of density (① <u>how many people are</u> in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, ② <u>which makes</u> people experience sensory overload, a lack of control, and rising stress and anxiety. However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors ③ <u>intensify</u> as density increases. So if an individual is looking forward to a concert, say, the feeling of crowding ④ <u>enhances</u> their enjoyment of the performance. But if they are dreading an event, crowding will make the person’s experience of it even worse. Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises. Conversely, ⑤ <u>create</u> positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension.","* accentuate: 두드러지게 하다 ** defuse: 완화하다"]},expl:"⑤ 문장의 주어 자리이므로 동명사 creating. ①은 간접의문문 어순, ②는 앞 절을 받는 계속적 용법 which, ③은 복수주어 moods and behaviors와 수 일치, ④는 단수주어 the feeling과 수 일치로 모두 옳음.",type:"어법"},{n:21,area:"독해",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Music feels satisfying when it builds (A) and then releases it; in a prelude this comes from an unclear rhythm, while in the following movement it comes from (B) harmonies."],opts:["suspense …… familiar","comfort …… surprising","suspense …… surprising","rhythm …… predictable","comfort …… simple"],answer:3,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오.",lines:["Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself. Most of the time, however, we want something more to happen. There needs to be a process that creates tension and drives the movement towards something in particular. The excitement that arises in this process creates satisfaction and pleasure. This is seen in the measureless prelude as well. But there the tension might be caused by the ambiguity of the rhythm. Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm. This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece.","* prelude: 전주곡 ** ambiguity: 모호함 *** modulation: (음악의) 전조"]},expl:"tension → suspense, unexpected chords and modulations → surprising harmonies.",type:"요약문 완성"},{n:22,area:"독해",q:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:[],opts:["far less accurate and static","significantly cheaper and simpler","entirely new but unreliable","much more detailed and dynamic","slower but more secure"],answer:4,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오.",lines:["Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations. Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years. However, faster wireless networks and the resulting availability of real-time data enable __________________________ digital representations. When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin. The digital twin becomes a real-time accurate copy of a physical object’s properties and states. For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly.","* replica: 복제본 ** downtime: 비가동 시간"]},expl:"실시간 데이터가 더 상세하고 역동적인 표현을 가능하게 함.",type:"빈칸 추론"},{n:23,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3,stem:["When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains."],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오.",lines:["Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness. ( ① ) At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss. ( ② ) Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. ( ③ ) Psychotherapist Fran Weller describes grief work is “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” ( ④ ) In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. ( ⑤ ) Grief can make us both very sad and very motivated to act.","* transience: 덧없음"]},expl:"Weller의 인용 뒤, 남은 것에 대한 사랑의 강화 → 다음 문장 In time this may build a desire로 연결.",type:"문장 삽입"},{n:24,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:3,stem:["Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are shared with other people.","(A) In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally developed from membership in a stable group.","(B) But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms.","(C) For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing)."],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:5,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오.",lines:["Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness. ( ① ) At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss. ( ② ) Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. ( ③ ) Psychotherapist Fran Weller describes grief work is “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” ( ④ ) In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. ( ⑤ ) Grief can make us both very sad and very motivated to act.","* niche: 적소, 적당한 장소"]},expl:"공유된 의미 선호 → For example 라운지/호텔 → But 호텔은 왜? → In fact 안정된 집단 부재.",type:"글의 순서"},{n:25,area:"독해",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것은?",pts:3.4,stem:["Algorithms act as (A) of our digital choices and can push us toward certain options, so keeping our (B) requires us to question their outputs and to remember that their data describes the (C), not the future."],opts:["designers …… independence …… past","designers …… independence …… truth","observers …… creativity …… past","designers …… emotions …… present","victims …… independence …… present"],answer:1,passage:{title:"[25] 다음 글을 읽고 물음에 답하시오.",lines:["The concept of “choice architecture,” popularized in behavioral economics, highlights how the design of the environment in which choices are made can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended, and what options are presented to us, they subtly, and sometimes not so subtly, nudge us towards particular paths. While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects are not aligned with the well-being or autonomy of the individual. The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world? It requires a conscious effort to maintain critical engagement with the technologies we use. It means actively seeking out diverse perspectives, questioning algorithmic recommendations, and making deliberate choices that go against the predicted grain. It involves cultivating a healthy skepticism towards the seemingly objective outputs of a
