ay towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."]},expl:"",type:"주제"},{n:11,area:"독해",q:"다음 글의 요지로 가장 적절한 것은?",pts:3.2,stem:[],opts:["당대에 이해받지 못한 작곡가는 결국 잊히기 마련이다.","음악적 형식은 낯설수록 대중에게 널리 받아들여진다.","위대한 작곡가를 가르는 것은 실력이 아니라 독창성이다.","영화는 작곡가에 대한 대중의 평가를 결정적으로 바꾼다.","동시대의 평가는 작품의 가치를 판단하는 가장 좋은 기준이다."],answer:3,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the ”host” of this movie; he’s depicted as one of the most famous non-great composers ─ he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time."]},expl:"위대한 작곡가들이 당대에 이해받지 못한 이유는 낯섦이었고 바로 그 새로움이 위대함의 근거라고 한 뒤, 훌륭했으나 독창적이지 않았던 Salieri는 위대한 작곡가가 되지 못했다고 마무리한다. 실력과 독창성을 가르는 대목이 글의 요지이다.",type:"요지"},{n:12,area:"독해",q:"다음 글의 주제로 가장 적절한 것은?",pts:3.2,stem:[],opts:["distributing cognition across a society rather than within one mind","the Nobel Prize research that measured human memory capacity","why modern technology has become too complex for ordinary users","the danger of relying on interfaces we do not actually understand","how each generation forgets what the previous one discovered"],answer:1,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Herbert Simon won his Nobel Prize for recognizing our limitations in information, time, and cognitive capacity. As we lack the resources to compute answers independently, we distribute the computation across the population and solve the answer slowly, generation by generation. Then all we have to do is socially learn the right answers. You don’t need to understand how your computer or toilet works; you just need to be able to use the interface and flush. All that needs to be transmitted is which button to push ─ essentially how to interact with technologies rather than how they work. And so instead of holding more information than we have mental capacity for and indeed need to know, we could dedicate our large brains to a small piece of a giant calculation. We understand things well enough to benefit from them, but all the while we are making small calculations that contribute to a larger whole. We are just doing our part in a larger computation for our societies’ collective brains."]},expl:"개인은 정보·시간·인지 능력에 한계가 있어 계산을 인구 전체에 분배하고 세대를 거쳐 해답을 풀어 내며, 각자는 거대한 계산의 작은 조각을 맡는다는 것이 글 전체의 요지이다. 나머지는 지문에 등장하는 소재를 빌렸을 뿐 글 전체를 포괄하지 못한다.",type:"주제"},{n:13,area:"독해",q:"다음 글의 제목으로 가장 적절한 것은?",pts:3.2,stem:[],opts:["Chess, Chemistry, Tennis: Where Experts Are Made","Why Generalists Adapt Faster Than Specialists Do","How Many Facts Does a Profession Really Require?","Smart Thinkers and the Limits of Raw Intelligence","Not a Pile of Facts, but a Framework That Travels"],answer:5,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Studies of experts provide insight into what it means to have deep and flexible understanding. Experts in a particular domain are people who have deep, richly interconnected ideas about the world. They are not just good thinkers or people who are exceptionally smart. Rather, experts have knowledge in a specific domain ─ such as chess, chemistry, or tennis ─ and are not generalists. However, experts do not just know ”a bunch of facts.” In fact, having expertise in a topic means that knowledge is organized into coherent frameworks, and the expert understands the inter-relationship between facts and can distinguish which ideas are most central. This kind of deep but organized understanding allows for greater flexibility in learning and facilitates application across multiple contexts."]},expl:"전문가는 사실을 많이 아는 사람이 아니라 지식이 일관된 틀로 조직된 사람이며, 그 조직된 이해가 학습의 유연성과 여러 맥락에의 적용을 가능하게 한다는 것이 글의 핵심이다. 사실의 더미가 아니라 옮겨 다니는 틀이라는 제목이 이를 가장 잘 담는다.",type:"제목"},{n:14,area:"독해",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3.2,stem:[],opts:["authorship\t…… severity","authorship\t…… generosity","memory\t…… generosity","memory\t…… severity","ambition\t…… generosity"],answer:2,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Do you sometimes feel like you don’t love your life? Like, deep inside, something is missing? That’s because we are living someone else’s life. We allow other people to influence our choices. We are trying to meet their expectations. Social pressure is deceiving ─ we are all impacted without noticing it. Before we realize we are losing ownership of our lives, we end up envying how other people live. Then, we can only see the greener grass ─ ours is never good enough. To regain that passion for the life you want, you must recover control of your choices. No one but yourself can choose how you live. But, how? The first step to getting rid of expectations is to treat yourself kindly. You can’t truly love other people if you don’t love yourself first. When we accept who we are, there’s no room for other’s expectations.","Letting other people’s expectations steer our decisions costs us the (A)_________ of our own lives, and the way back begins with (B)_________ toward ourselves.","(A)\t(B)"]},expl:"(A) 타인의 기대에 맞추다 보면 삶에 대한 소유권(ownership)을 잃는다고 했으므로 이를 아우르는 authorship이 적절하다. memory와 ambition은 지문에 근거가 없다. (B) 기대를 버리는 첫 단계는 자신을 친절하게 대하는 것(treat yourself kindly)이라고 했으므로 generosity가 적절하고, severity는 정반대이다.",type:"요약"},{n:15,area:"독해",q:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?",pts:3.2,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["There’s a lot of scientific evidence demonstrating that ①[[focused]] attention leads to the reshaping of the brain. In animals rewarded for noticing sound (to hunt or to avoid being hunted for example), we find much ②[[larger]] auditory centers in the brain. In animals rewarded for ③[[sharp]] eyesight, the visual areas are larger. Brain scans of violinists provide more evidence, showing dramatic growth and expansion in regions of the cortex that represent the left hand, which has to finger the strings ④[[vaguely]], often at very high speed. Other studies have shown that the hippocampus, which is ⑤[[vital]] for spatial memory, is enlarged in taxi drivers. The point is that the physical architecture of the brain changes according to where we direct our attention and what we practice doing."]},expl:"바이올린 연주자의 왼손은 매우 빠른 속도로 현을 ‘정확하게(precisely)’ 짚어야 하고, 그 훈련이 해당 대뇌 피질 영역을 확장시켰다는 흐름이다. 따라서 애매하게라는 뜻의 낱말은 문맥과 정면으로 어긋난다.",type:"어휘"},{n:16,area:"독해",q:"다음 글의 내용과 일치하지 않는 것은?",pts:3.2,stem:[],opts:["이사는 모두에게 힘들지만 아이들에게 특히 스트레스가 크다.","일상이 무너지고 익숙한 것이 사라질 때 아이들은 혼란을 느낄 수 있다.","3세에서 6세 사이의 아이들이 이사에 특히 영향을 받는다.","아이들은 자신의 과거를 존중받는 방식으로 배경을 나눌 기회가 필요하다.","공동체 의식은 변화를 겪지 않는 아이들에게 특히 중요하다."],answer:5,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["While moving is difficult for everyone, it is particularly stressful for children. They lose their sense of security and may feel disoriented when their routine is disrupted and all that is familiar is taken away. Young children, ages 3-6, are particularly affected by a move. Their understanding at this stage is quite literal, and it is difficult for them to imagine beforehand a new home and their new room. Young children may have worries such as ”Will I still be me in the new place?” and ”Will my toys and bed come with us?” It is important to establish a balance between validating children’s past experiences and focusing on helping them adjust to the new place. Children need to have opportunities to share their backgrounds in a way that respects their past as an important part of who they are. This contributes to building a sense of community, which is essential for all children, especially those in transition."]},expl:"공동체 의식은 모든 아이들에게 필수적이며 특히 변화를 겪는 아이들에게 가장 중요하다고 했다. 변화를 겪지 않는 아이들에게 특히 중요하다는 진술은 지문을 뒤집은 것이다.",type:"내용일치"},{n:17,area:"독해",q:"다음 글의 주제로 가장 적절한 것은?",pts:3.2,stem:[],opts:["the technical difficulty of animating an animal’s front legs","how children learn to tell cartoon animals from real ones","human traits projected onto animal characters to make them appealing","the decline of talking animals in recent animated movies","why toy makers copy the proportions of real animals"],answer:3,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["The most noticeable human characteristic projected onto animals is that they can talk in human language. Physically, animal cartoon characters and toys made after animals are also most often deformed in such a way as to resemble humans. This is achieved by showing them with humanlike facial features and deformed front legs to resemble human hands. In more recent animated movies the trend has been to show the animals in a more ”natural” way. However, they still use their front legs like human hands (for example, lions can pick up and lift small objects with one paw), and they still talk with an appropriate facial expression. A general strategy that is used to make the animal characters more emotionally appealing, both to children and adults, is to give them enlarged and deformed childlike features."]},expl:"동물 캐릭터에 인간의 언어·얼굴·손을 투영해 변형하고, 최근에는 더 자연스러운 방식을 표방하면서도 여전히 그렇게 하며, 어린이 같은 특징을 확대해 감정적 매력을 높인다는 것이 글 전체의 흐름이다. 최근 경향을 다룬 선택지는 지문의 한 문장만 확대했다.",type:"주제"},{n:18,area:"독해",q:"다음 글의 제목으로 가장 적절한 것은?",pts:3.2,stem:[],opts:["Twelve Careers That Began With a Reading Test","Teaching Strategies That Bypass a Reading Disability","Passion Beat Difficulty: Why Dyslexic Readers Read More","The Physicist, the Biochemist, and the CEO","How Schools Should Measure Reading Achievement"],answer:3,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["A key to engagement and achievement is providing students with relevant texts they will be interested in. My scholarly work and my teaching have been deeply influenced by the work of Rosalie Fink. She interviewed twelve adults who were highly successful in their work, including a physicist, a biochemist, and a company CEO. All of them had dyslexia and had had significant problems with reading throughout their school years. While she expected to find that they had avoided reading and discovered ways to bypass it or compensate with other strategies for learning, she found the opposite. ”To my surprise, I found that these dyslexics were enthusiastic readers... they rarely avoided reading. On the contrary, they sought out books.” The pattern Fink discovered was that all of her subjects had been passionate in some personal interest. The areas of interest included religion, math, business, science, history, and biography. What mattered was that they read voraciously to find out more."]},expl:"난독증이 있는 성공한 성인들이 읽기를 피했을 것이라는 예상과 달리 열성적인 독자였고, 그 공통점은 개인적 관심사에 대한 열정이었으며 더 알아내기 위해 탐욕스럽게 읽었다는 것이 핵심이다. 읽기를 우회하는 전략을 다룬 선택지는 지문이 예상했다가 부정한 내용이다.",type:"제목"},{n:19,area:"독해",q:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",pts:3.2,stem:[],opts:["창작에 몰두할 때에는 손님을 정중히 돌려보내야 한다.","방해가 치르게 하는 대가를 가볍게 여기지 말아야 한다.","영감이 떠오르면 반드시 그 자리에서 기록해 두어야 한다.","의사와 조종사에게는 별도의 근무 규정이 필요하다.","스트레스를 줄이려면 업무 생산성부터 점검해야 한다."],answer:2,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["The costs of interruptions are well-documented. Martin Luther King Jr. lamented them when he described ”that lovely poem that didn’t get written because someone knocked on the door.” Perhaps the most famous literary example happened in 1797 when Samuel Taylor Coleridge started writing his poem Kubla Khan from a dream he had but then was visited by an unexpected guest. For Coleridge, by coincidence, the untimely visitor came at a particularly bad time. He forgot his inspiration and left the work unfinished. While there are many documented cases of sudden disruptions that have had significant consequences for professionals in critical roles such as doctors, nurses, control room operators, stock traders, and pilots, they also impact most of us in our everyday lives, slowing down work productivity and generally increasing stress levels."]},expl:"방해로 인한 대가가 잘 기록되어 있다고 시작해, 문을 두드리는 바람에 쓰이지 못한 시와 Coleridge의 미완성 작품을 들고, 전문가뿐 아니라 일상에서도 생산성을 떨어뜨리고 스트레스를 높인다고 마무리한다. 나머지는 예시에서 끌어온 소재일 뿐이다.",type:"주장"},{n:20,area:"독해",q:"다음 글에서 밑줄 친 부분이 의미하는 바로 가장 적절한 것은?",pts:3.2,stem:[],opts:["the relief of finally paying off what one owes","the pleasure of buying something long wanted","the comfort of keeping objects that carry memories","the satisfaction that follows once the clutter is gone","the pride of owning fewer things than one’s neighbours"],answer:4,passage:{title:"[20] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["The term minimalism gives a negative impression to some people who think that it is all about sacrificing valuable possessions. This insecurity naturally stems from their attachment to their possessions. It is difficult to distance oneself from something that has been around for quite some time. Being an emotional animal, human beings give meaning to the things around them. So, the question arising here is that if minimalism will hurt one’s emotions, why become a minimalist? The answer is very simple; the assumption of the question is fundamentally wrong. Minimalism does not hurt emotions. You might feel a bit sad while getting rid of a useless item but sooner than later, this feeling will be overcome by [[the joy of clarity]]. Minimalists never argue that you should leave every convenience of the modern era. They are of the view that you only need to eliminate stuff that is unused or not going to be used in the near future."]},expl:"쓸모없는 물건을 치우면서 잠깐 슬플 수는 있어도 머지않아 그 감정이 극복된다는 맥락이므로, 밑줄은 어지러운 것이 사라진 뒤에 오는 만족을 뜻한다. 소유에 관한 다른 선택지들은 지문이 오히려 문제 삼는 태도이다.",type:"함의"},{n:21,area:"독해",q:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?",pts:3.2,stem:[],opts:["①","②","③","④","⑤"],answer:5,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Rejection is an everyday part of our lives, yet most people can’t ①[[handle]] it well. For many, it’s so painful that they’d ②[[rather not ask]] for something at all than ask and risk rejection. Yet, as the old saying goes, if you don’t ask, the answer is always no. ③[[Avoiding]] rejection negatively affects many aspects of your life. All of that happens only because you’re not ④[[tough enough]] to handle it. For this reason, consider rejection therapy. Come up with a request or an activity that usually results in a rejection. Working in sales is one such example. Asking for discounts at the stores will also work. By deliberately getting yourself rejected you’ll grow a thicker skin that will allow you to take on much more in life, thus ⑤[[made]] you more successful at dealing with unfavorable circumstances."]},expl:"앞 절 전체를 의미상 주어로 삼아 결과를 나타내는 분사구문이므로 과거분사가 아니라 현재분사 making이 되어야 한다. 나머지는 조동사 뒤의 동사원형, 「would rather A than B」의 A 자리, 주어로 쓰인 동명사, 「형용사 + enough + to부정사」로 모두 적절하다.",type:"어법"},{n:22,area:"독해",q:"다음 글에서 전체 흐름과 관계 없는 문장은?",pts:3.2,stem:[],opts:["①","②","③","④","⑤"],answer:4,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Plant growth is controlled by a group of hormones called auxins found at the tips of stems and roots of plants. Auxins produced at the tips of stems tend to accumulate on the side of the stem that is in the shade. ① Accordingly, the auxins stimulate growth on the shaded side of the plant. ② Therefore, the shaded side grows faster than the side facing the sunlight. ③ This phenomenon causes the stem to bend and appear to be growing towards the light. ④ Gardeners often rotate a potted plant so that every side receives the same amount of light. ⑤ Auxins have the opposite effect on the roots of plants. Auxins in the tips of roots tend to limit growth. If a root is horizontal in the soil, the auxins will accumulate on the lower side and interfere with its development. Therefore, the lower side of the root will grow slower than the upper side. This will, in turn, cause the root to bend downwards, with the tip of the root growing in that direction."]},expl:"옥신이 줄기에서는 그늘진 쪽의 성장을 자극하고 뿌리에서는 아래쪽의 성장을 억제한다는 원리를 설명하는 글이다. 화분을 돌려 준다는 재배 요령은 원리 설명과 층위가 다르다. 이 문장을 빼면 줄기에서 뿌리로 넘어가는 대비가 그대로 이어진다.",type:"무관한 문장"},{n:23,area:"독해",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",pts:3.2,stem:[],opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],answer:2,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["In everyday life, we use previous experience to predict where we should pay attention. Different environments create different expectations.","(A) He relates that these natives tend to perform poorly at tasks Westerners have been trained to do since childhood. But they are hardly stupid.","(B) This was profoundly illustrated by the scientist Jared Diamond in his book Guns, Germs, and Steel. He describes an adventure wandering through the New Guinea jungle with native New Guineans.","(C) They can detect the most subtle changes in the jungle, good for following the tracks of a predator or for finding the way back home. They know which insects to leave alone, know where food exists, can build and tear down shelters with ease. Diamond, who had never spent time in such places, has no ability to pay attention to these things. Were he to be tested on such tasks, he also would perform poorly."]},expl:"환경이 다르면 기대도 달라진다는 주어진 글 다음에, 그것을 보여 준 Jared Diamond의 저서와 뉴기니 정글 모험을 소개하는 단락이 온다. 그 원주민들이 서구식 과업을 잘 못한다는 서술과 그래도 어리석지 않다는 반전이 이어지고, 정글에서의 능력과 Diamond 자신도 못할 것이라는 결론으로 마무리된다.",type:"순서"},{n:24,area:"독해",q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",pts:3.2,stem:[],opts:["①","②","③","④","⑤"],answer:1,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["One possible reason is that many thousands of years ago humans lived in a world of dangerous predators where they had to have their wits about them at all times to avoid being killed.","The human brain, it turns out, has shrunk in mass by about 10 percent since it peaked in size 15,000-30,000 years ago. ( ① ) Today, we have effectively domesticated ourselves and many of the tasks of survival - from avoiding immediate death to building shelters to obtaining food - have been outsourced to the wider society. ( ② ) We are smaller than our ancestors too, and it is a characteristic of domestic animals that they are generally smaller than their wild cousins. ( ③ ) None of this may mean we are dumber ─ brain size is not necessarily an indicator of human intelligence ─ but it may mean that our brains today are wired up differently, and perhaps more efficiently, than those of our ancestors. ( ④ ) ( ⑤ )"]},expl:"주어진 문장은 뇌가 작아진 데 대한 ‘한 가지 가능한 이유’를 제시하며 수천 년 전의 위험한 포식자 세계를 언급한다. 뇌가 줄어들었다는 사실 제시 바로 뒤, 그리고 오늘날 우리는 스스로를 길들였다는 대비 앞에 와야 한다.",type:"삽입"},{n:25,area:"독해",q:"다음 글의 내용과 일치하지 않는 것은?",pts:3.2,stem:[],opts:["긴장이 덜한 종일수록 위협을 느끼면 즉시 도망간다.","어떤 종은 무리 속에서 보호를 찾고 필요할 때까지 도망가지 않는다.","긴장하는 종은 갇힌 상태를 유지하기 어렵다.","가젤은 비옥한 초승달 지대에서 가장 빈번하게 사냥된 사냥감이었다.","어떤 가젤 종도 지금까지 길들여진 적이 없다."],answer:1,passage:{title:"[25] 다음 글을 읽고 물음에 답하시오. · 부교재",lines:["Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!","본 자료는 헤일리영어학원에서 제작한 예상 문제입니다. 무단 전재 및 복제를 금합니다."]},expl:"위협을 감지했을 때 즉각 도망가도록 프로그램된 것은 긴장이 덜한 종이 아니라 긴장하고 빠른 종이다. 덜 긴장하는 다른 종들은 무리 속에서 보호를 찾고 필요할 때까지 도망가지 않는다고 했다.",type:"내용일치"}],essays:[{n:26,q:"다음은 윗글의 일부이다. 밑줄 친 ①~⑤ 중 <b>어법상 틀린 것 2개</b>를 찾아 기호를 쓰고 바르게 고쳐 쓰시오.",pts:5,area:"서술형",cond:"기호와 고친 형태를 함께 쓸 것 / 한 단어로만 고칠 것",parts:[{label:"",ko:"",pts:5,answers:["① can be discouraged → can discourage / ④ are → is"]}],prompt:[],stimulus:"",excerpt:"Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type ① <u>can be discouraged</u> a reader from even ② <u>starting</u> to read. You may think such frequent paragraphing will damage the development of your point. Don’t worry; the gains far ③ <u>outweigh</u> the hazards. But don’t go too far. A succession of tiny paragraphs ④ <u>are</u> as annoying as a paragraph that’s too long. Actually they make the reader’s job ⑤ <u>harder</u> by chopping up a natural train of thought.",model:"① can be discouraged → can discourage / ④ are → is",crit:[],scoring:["①은 뒤에 목적어 a reader가 있으므로 능동태(can discourage). ④의 주어는 단수 A succession(of 뒤 복수명사에 끌리지 말 것). ②는 from 뒤 동명사, ③은 복수주어 the gains와 수 일치, ⑤는 make+목적어+형용사(비교급)로 모두 옳음."],passageRef:"6번 지문",type:"어법 고치기"},{n:27,q:"윗글의 밑줄 친 문장과 같은 뜻이 되도록, 다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"There is로 시작할 것 / between A and B 구문을 사용할 것 / plan, come to fruition을 알맞은 형태로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["There is a difference between planning and thinking all your plans have to come to fruition."]}],prompt:[],stimulus:"계획을 세우는 것과 당신의 모든 계획이 반드시 실현되어야 한다고 생각하는 것 사이에는 차이가 있다.",excerpt:"",model:"There is a difference between planning and thinking all your plans have to come to fruition.",crit:[],scoring:["between 뒤 두 항목을 모두 동명사로 병렬시켰는지에 배점."],passageRef:"4번 지문",type:"밑줄 영작"},{n:28,q:"다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:5,area:"서술형",cond:"현재진행 수동태를 사용할 것 / held, captive, devices를 어형 변화 없이 사용할 것 / 총 14단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["Many kids today are being held captive by ‘smart’ devices like phones and tablets."]}],prompt:[],stimulus:"오늘날 많은 아이들이 휴대전화와 태블릿 같은 ‘스마트’ 기기에 사로잡혀 있다.",excerpt:"",model:"Many kids today are being held captive by ‘smart’ devices like phones and tablets.",crit:[],scoring:["are being held(진행 수동) 정확성에 배점."],passageRef:"1번 지문",type:"조건 영작"},{n:29,q:"윗글의 주제를 <조건>에 맞게 한 문장의 영어로 쓰시오.",pts:5,area:"서술형",cond:"To attract로 시작할 것 / belief, match(또는 fit)를 반드시 포함할 것 / 12~18단어로 쓸 것",parts:[{label:"",ko:"",pts:5,answers:["To attract what you want, you must first hold a belief system that matches your desires."]}],prompt:[],stimulus:"— 필자가 가장 강력한 요인이라고 말한 것이 무엇인지 드러나도록 쓸 것",excerpt:"",model:"To attract what you want, you must first hold a belief system that matches your desires.",crit:[],scoring:["belief system이 가장 강력한 attractor라는 핵심이 드러나면 정답 처리."],passageRef:"2번 지문",type:"주제문 영작"}]},g1_sunyeo:{id:"g1_sunyeo",title:"고1 순여고 · 1회차 (모의고사)",grade:"고1",school:"순여고",round:1,minutes:60,scope:"2609 21,22,23,31~34,40 + 2509 21,29,30,31",mcq:[{n:1,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["스마트 기기는 아이들의 학습 능력을 향상시키는 데 도움이 된다.","정서적 성숙은 또래와의 대화를 통해 가장 빠르게 이루어진다.","운동 능력은 타고나는 것이므로 훈련으로 바꾸기 어렵다.","인간은 움직이도록 만들어졌으므로 활동적인 삶을 되찾아야 한다.","실내 활동보다 야외 활동이 학업 성취도를 직접적으로 높인다."],answer:4,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by ‘smart’ devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move—and through movement, we are meant to live extraordinary lives. Movement is life to us."]},expl:"",type:"요지"},{n:2,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Human beings were built for constant ______(A)______ , but many children today, held by screens, fail to develop the movement skills that support learning and emotional ______(B)______ ."],opts:["stillness …… maturity","competition …… obedience","motion …… isolation","stillness …… anxiety","motion …… maturity"],answer:5,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by ‘smart’ devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move—and through movement, we are meant to live extraordinary lives. Movement is life to us."]},expl:"",type:"요약문"},{n:3,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Your Beliefs Decide What You Attract","Visualize It and It Will Come True","Positive Thinking: A Myth Without Evidence","Why Magnetic Words Fail in Relationships","Set Goals You Can Actually Measure"],answer:1,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]},expl:"",type:"제목"},{n:4,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["why visualizing goals guarantees material success","the role of our belief systems in what we attract","scientific evidence against the Law of Attraction","practical methods for creating an effective vision board","how positive words influence other people’s moods"],answer:2,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]},expl:"",type:"주제"},{n:6,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["환경 변화는 생물 종의 신체 구조를 먼저 바꾼다.","문화가 다르면 지능의 발달 속도도 달라진다.","인간의 마음이 다양해야 종의 생존 가능성이 높아진다.","자연선택은 개체보다 집단 단위로 일어난다.","재난 대비 교육은 어릴수록 효과가 크다."],answer:3,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe—the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind—if there were only one human nature—then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out. This variation preserves the evolvability of our species."]},expl:"",type:"요지"},{n:7,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["One Human Nature Would Be Enough","Darwin’s Mistake About Animal Bodies","How Culture Erases Individual Differences","Surviving Disaster Through Cooperation","Variation of Minds: Our Species’ Insurance Policy"],answer:5,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe—the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind—if there were only one human nature—then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out. This variation preserves the evolvability of our species."]},expl:"",type:"제목"},{n:8,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["how our food preferences are shaped by the people around us","why traditional village recipes are disappearing today","the biological basis of the human sense of taste","health risks of following food trends on social media","ways to develop a more objective judgment of food"],answer:1,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn’t flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."]},expl:"",type:"주제"},{n:9,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["The Village Recipe Nobody Can Copy","Why Milk Is Every Child’s First Food","Food Trends That Refuse to Die","Taste Travels From Person to Person","Judge the Food, Not the People Who Eat It"],answer:4,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We obser y sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren’t just automatic reactions. They’re shaped by how we interpret events. Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. <u class="g">Change the judgment, and you change the emotion.</u> This doesn’t mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better.']},expl:"",type:"제목"},{n:13,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["감정은 사건 자체가 아니라 그에 대한 해석에서 생겨난다.","분노를 표현하지 않고 억누르는 것이 성숙한 태도이다.","비판을 받아들이려면 먼저 상대의 의도를 확인해야 한다.","실직과 같은 큰 사건은 한 사람의 가치를 실제로 결정한다.","감정은 자동적 반응이므로 훈련으로는 바꿀 수 없다."],answer:1,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:['One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren’t just automatic reactions. They’re shaped by how we interpret events. Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. <u class="g">Change the judgment, and you change the emotion.</u> This doesn’t mean suppressing how you feel; it tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis—simple copying—does not sufficiently define art."]},expl:"",type:"제목"},{n:16,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["training methods that prevent common running injuries","why our bodies know more about running than our minds do","how supercomputers simulate complex human movement","the history of long-distance running competitions","reasons running is better exercise than walking"],answer:2,passage:{title:"[16] 다음 글을 읽고 물음에 답하시오.",lines:["If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."]},expl:"",type:"주제"},{n:17,area:"독해",q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",pts:3,stem:["Running looks easy only because our bodies are extremely ______(A)______ at it, and its real complexity lies ______(B)______ too deep inside us to be fully explained."],opts:["clumsy …… buried","skilled …… exposed","slow …… measured","clumsy …… measured","skilled …… buried"],answer:5,passage:{title:"[17] 다음 글을 읽고 물음에 답하시오.",lines:["If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."]},expl:"",type:"요약문"},{n:18,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["methods of raising self-esteem in early childhood","the danger of relying too much on others’ opinions","how the brain stores memories of social rejection","self-esteem as a system that monitors our social acceptance","why conscious thinking slows down social judgment"],answer:4,passage:{title:"[18] 다음 글을 읽고 물음에 답하시오.",lines:['From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. <u class="g">The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.</u> When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.']},expl:"",type:"주제"},{n:19,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Why Self-Esteem Should Be Ignored","The Alarm Bell That Guards Our Relationships","Conscious Thinking Always Beats Instinct","Rejection: A Problem Only Humans Face","How to Stop Caring What Others Think"],answer:2,passage:{title:"[19] 다음 글을 읽고 물음에 답하시오.",lines:['From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. <u class="g">The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.</u> When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.']},expl:"",type:"제목"},{n:21,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["how breathing changes the chemical structure of atoms","the difficulty of tracing the origin of the heaviest atoms","atoms being borrowed and endlessly recycled among all things","why the human body must replace its cells regularly","the role of sweat in regulating human body temperature"],answer:3,passage:{title:"[21] 다음 글을 읽고 물음에 답하시오.",lines:['Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. <u class="g">You don’t “own” the atoms that make up your body; you borrow them.</u> We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You’re the present caretaker of the atoms in your body. There will be many who will follow you.']},expl:"",type:"주제"},{n:22,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["호흡으로 들이마신 원자는 대부분 곧바로 다시 배출된다.","가벼운 원자는 무거운 원자보다 나중에 만들어졌다.","인간의 몸은 다른 생명체와 원자를 공유하지 않는다.","우리 몸의 원자는 소유물이 아니라 끝없이 순환하며 잠시 빌린 것이다.","원자의 기원을 밝히는 일은 현대 과학의 최대 난제이다."],answer:4,passage:{title:"[22] 다음 글을 읽고 물음에 답하시오.",lines:['Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. <u class="g">You don’t “own” the atoms that make up your body; you borrow them.</u> We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You’re the present caretaker of the atoms in your body. There will be many who will follow you.']},expl:"",type:"요지"},{n:23,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Why Gazelles Were Never Domesticated","Herds: The Safest Place for Every Mammal","The Fertile Crescent: Birthplace of Agriculture","How Predators Reshape an Entire Landscape","Captivity Makes Wild Animals Calmer"],answer:1,passage:{title:"[23] 다음 글을 읽고 물음에 답하시오.",lines:["Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"]},expl:"",type:"제목"},{n:24,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:3,stem:[],opts:["why nervous herbivores resist domestication","hunting techniques used in the Fertile Crescent","how herds protect slow-moving animals from predators","the physical abilities that make gazelles so fast","differences between wild and farmed mammals’ diets"],answer:1,passage:{title:"[24] 다음 글을 읽고 물음에 답하시오.",lines:["Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"]},expl:"",type:"주제"},{n:26,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["유목 부족은 여행자에게 음식을 나누어 주는 오랜 전통이 있다.","자원이 부족할수록 사회적 안전 장치가 더 많이 필요해진다.","나눔은 본능이 아니라 교육을 통해 학습되는 행동이다.","가진 것이 많아질수록 나누려는 본래의 성향은 약해진다.","타인과의 교류를 늘리면 물질에 대한 욕구를 줄일 수 있다."],answer:4,passage:{title:"[26] 다음 글을 읽고 물음에 답하시오.",lines:["For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don’t have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It’s not just because they are nice people; it’s because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our decreased physical interaction with the “common folk,” starts to create a disconnection or blindness to reality."]},expl:"",type:"요지"},{n:27,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Nomads: The Kindest People on Earth","Build Higher Fences, Sleep Better","The More We Own, the Less We Share","Why Cooperation Evolved in Safe Times","Sharing Is a Skill That Must Be Taught"],answer:3,passage:{title:"[27] 다음 글을 읽고 물음에 답하시오.",lines:["For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don’t have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It’s not just because they are nice people; it’s because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our decreased physical interaction with the “common folk,” starts to create a disconnection or blindness to reality."]},expl:"",type:"제목"},{n:28,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:3,stem:[],opts:["Chase the Highs, Escape the Lows","Why Happiness Always Returns to Its Baseline","Children Feel Joy More Deeply Than Adults Do","First Love: The Feeling That Never Fades","Buy Less, Want Less, Live Better"],answer:2,passage:{title:"[28] 다음 글을 읽고 물음에 답하시오.",lines:["Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience—a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust—to new information and events both good and bad—and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline—back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids—like adults—adapt."]},expl:"",type:"제목"},{n:29,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:3,stem:[],opts:["어린아이는 어른보다 기쁨을 훨씬 오래 유지한다.","첫사랑의 경험이 평생의 행복 수준을 결정한다.","행복은 순간순간의 사건들이 합쳐진 총합이다.","이별의 절망은 시간이 지나도 줄어들지 않는다.","좋은 일과 나쁜 일에 적응하여 사람은 자신의 기본 행복 수준으로 돌아온다."],answer:5,passage:{title:"[29] 다음 글을 읽고 물음에 답하시오.",lines:["Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience—a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust—to new information and events both good and bad—and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline—back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids—like adults—adapt."]},expl:"",type:"요지"}],essays:[{n:5,q:"윗글의 주제를 <조건>에 맞게 한 문장의 영어로 쓰시오.",pts:7,area:"서술형",cond:"To attract로 시작할 것 / belief, match(또는 fit)를 반드시 포함할 것 / 12~18단어로 쓸 것",parts:[{label:"",ko:"",pts:7,answers:["To attract what you want, you must first hold a belief system that matches your desires."]}],prompt:[],stimulus:"— 필자가 가장 강력한 요인이라고 말한 것이 무엇인지 드러나도록 쓸 것",excerpt:"",model:"To attract what you want, you must first hold a belief system that matches your desires.",crit:[],scoring:["belief system이 가장 강력한 attractor라는 핵심이 드러나면 정답 처리."],type:"주제문 영작",passage:{title:"[서술형] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]}},{n:11,q:"다음은 윗글의 일부이다. 밑줄 친 ①~⑤ 중 <b>어법상 틀린 것 2개</b>를 찾아 기호를 쓰고 바르게 고쳐 쓰시오.",pts:6,area:"서술형",cond:"기호와 고친 형태를 함께 쓸 것 / 한 단어로만 고칠 것",parts:[{label:"",ko:"",pts:6,answers:["④ liking → like / ⑤ that → which"]}],prompt:[],stimulus:"",excerpt:"Even when you first drank milk, there was also the person behind the milk ① <u>who</u> will have presumably made or messed up your relationship with food. A village develops a particular recipe for an apple pie—one ② <u>that</u> nobody outside the village likes. We want these things not just because of what they are, but ③ <u>who</u> we are. Nothing turns me off something quicker than the wrong people ④ <u>liking</u> it, by ⑤ <u>that</u> I mean people almost identical to me.",model:"④ liking → like / ⑤ that → which",crit:[],scoring:["④는 than 뒤에 비교되는 절이 오므로 the wrong people like it. ⑤는 전치사(by) 뒤에 that을 쓸 수 없으므로 which. ①은 사람 선행사의 주격 관계대명사, ②는 one을 수식하는 목적격 관계대명사, ③은 보어 자리의 의문사 who로 모두 옳음."],type:"어법 고치기",passage:{title:"[서술형] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn’t flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."]}},{n:20,q:"윗글의 밑줄 친 문장과 같은 뜻이 되도록, 다음 우리말을 <조건>에 맞게 영어로 쓰시오.",pts:6,area:"서술형",cond:"The monitoring system으로 시작할 것 / until이 이끄는 부사절을 쓸 것 / detect를 알맞은 형태로 쓸 것",parts:[{label:"",ko:"",pts:6,answers:["The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low."]}],prompt:[],stimulus:"그 감시 체계는 우리의 관계적 가치가 떨어지고 있거나 낮다는 것을 감지할 때까지 일반적으로 무의식적으로 작동한다.",excerpt:"",model:"The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.",crit:[],scoring:["until절의 시제를 미래로 쓰면(will detect) 감점."],type:"밑줄 영작",passage:{title:"[서술형] 다음 글을 읽고 물음에 답하시오.",lines:['From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people’s reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. <u class="g">The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.</u> When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure.']}},{n:25,q:"윗글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말을 <조건>에 맞게 쓰시오.",pts:6,area:"서술형",cond:"각각 한 단어로 쓸 것 / (A)는 f-, (B)는 t-로 시작할 것 / 윗글에 쓰인 단어를 그대로 쓰지 말 것",parts:[{label:"",ko:"",pts:6,answers:["(A) fright (B) tamed"]}],prompt:[],stimulus:"Herbivores that answer danger by fleeing in ______(A)______ cannot endure being enclosed, which is why gazelles, though hunted for thousands of years, were never ______(B)______.",excerpt:"",model:"(A) fright (B) tamed",crit:[],scoring:["panic / domesticated의 paraphrase. (A)는 fear, (B)는 tame의 과거분사형이면 인정."],type:"요약문 빈칸",passage:{title:"[서술형] 다음 글을 읽고 물음에 답하시오.",lines:["Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"]}}]},g1_jeil:{id:"g1_jeil",title:"고1 제일고 · 1회차 (모의고사)",grade:"고1",school:"제일고",round:1,minutes:60,scope:"2609 21~24, 29~40",mcq:[{n:1,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:5,stem:[],opts:["스마트 기기는 아이들의 학습 능력을 향상시키는 데 도움이 된다.","정서적 성숙은 또래와의 대화를 통해 가장 빠르게 이루어진다.","운동 능력은 타고나는 것이므로 훈련으로 바꾸기 어렵다.","인간은 움직이도록 만들어졌으므로 활동적인 삶을 되찾아야 한다.","실내 활동보다 야외 활동이 학업 성취도를 직접적으로 높인다."],answer:4,passage:{title:"[1] 다음 글을 읽고 물음에 답하시오.",lines:["We are wonderfully made, yet we don’t allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by ‘smart’ devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move—and through movement, we are meant to live extraordinary lives. Movement is life to us."]},expl:"",type:"요지"},{n:2,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:5,stem:[],opts:["Your Beliefs Decide What You Attract","Visualize It and It Will Come True","Positive Thinking: A Myth Without Evidence","Why Magnetic Words Fail in Relationships","Set Goals You Can Actually Measure"],answer:1,passage:{title:"[2] 다음 글을 읽고 물음에 답하시오.",lines:["Perhaps you have heard of the Law of Attraction, which states that ‘like attracts like’ and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don’t truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."]},expl:"",type:"제목"},{n:3,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:5,stem:[],opts:["환경 변화는 생물 종의 신체 구조를 먼저 바꾼다.","문화가 다르면 지능의 발달 속도도 달라진다.","인간의 마음이 다양해야 종의 생존 가능성이 높아진다.","자연선택은 개체보다 집단 단위로 일어난다.","재난 대비 교육은 어릴수록 효과가 크다."],answer:3,passage:{title:"[3] 다음 글을 읽고 물음에 답하시오.",lines:["It’s important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin’s greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there’s a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe—the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind—if there were only one human nature—then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we’re less likely to be wiped out. This variation preserves the evolvability of our species."]},expl:"",type:"요지"},{n:4,area:"독해",q:"윗글에서 필자가 주장하는 바로 가장 적절한 것은?",pts:5,stem:[],opts:["불확실성을 줄이려면 계획을 더 구체적으로 세워야 한다.","예측 가능한 환경을 만들어 불안을 줄여야 한다.","타인의 계획을 존중하고 함부로 간섭하지 말아야 한다.","목표를 이루려면 세운 계획을 끝까지 밀어붙여야 한다.","계획이 뜻대로 되지 않을 수 있음을 받아들일 줄 알아야 한다."],answer:5,passage:{title:"[4] 다음 글을 읽고 물음에 답하시오.",lines:['Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty. Human beings want to know. When we don’t know, when things are uncertain, we often feel frightened and become inflexible. So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time. We cling to our plans and ideas about how things should be and turn out ever so desperately. And there’s nothing wrong with having plans. I think it’s a beautiful thing. <u class="g">But there’s a difference between planning and thinking all your plans have to come to fruition.</u> American president Eisenhower once said: ‘Plans are worthless, but planning is everything.’ Imagine if we all used pencil instead of ink to write in our calendars and planners. Both figuratively and literally. Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens. And if we could try our best to be all right with that.']},expl:"",type:"주장"},{n:5,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["the health risks of high-intensity workouts for beginners","two ways the body produces energy and how they affect exercise","foods that help athletes recover after intense training","how lung capacity differs between athletes and non-athletes","the role of sugar in building muscle strength"],answer:2,passage:{title:"[5] 다음 글을 읽고 물음에 답하시오.",lines:["To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it’s quicker and easier for our bodies to access. It’s a kind of backup system and turbo boost when the body doesn’t have enough oxygen. But anaerobic energy is inefficient and can be toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you’ve pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often so miserable. Our lungs and respiratory system haven’t caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we’re warmed up, exercise feels easier. The body has switched from anaerobic to aerobic respiration."]},expl:"",type:"주제"},{n:6,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:5,stem:[],opts:["신문 기사는 문장 길이를 통일해야 읽기 쉽다.","글의 논지 전개보다 시각적 배치가 언제나 더 중요하다.","기자는 독자의 수준에 맞추어 어휘를 선택해야 한다.","문단은 짧게 쓰되 지나치게 잘게 나누지는 말아야 한다.","긴 문단은 글쓴이의 사고의 깊이를 보여 준다."],answer:4,passage:{title:"[6] 다음 글을 읽고 물음에 답하시오.",lines:["Keep your paragraphs short. Writing is visual—it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear—a reader can go for miles without relief. Don’t worry; the gains far outweigh the hazards. But don’t go too far. A succession of tiny paragraphs is as annoying as a paragraph that’s too long. I’m thinking of all those tiny paragraphs—verbless wonders—written by modern journalists trying to make their articles quick ‘n’ easy. Actually they make the reader’s job harder by chopping up a natural train of thought."]},expl:"",type:"요지"},{n:7,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["how our food preferences are shaped by the people around us","why traditional village recipes are disappearing today","the biological basis of the human sense of taste","health risks of following food trends on social media","ways to develop a more objective judgment of food"],answer:1,passage:{title:"[7] 다음 글을 읽고 물음에 답하시오.",lines:["Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie—one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn’t flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."]},expl:"",type:"주제"},{n:8,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:5,stem:[],opts:["Stop Feeling: The Stoic Path to Peace","Why Criticism Hurts More Than Job Loss","Your Emotions Begin With Your Judgments","Automatic Reactions We Can Never Change","Anger Is Always a Reasonable Response"],answer:3,passage:{title:"[8] 다음 글을 읽고 물음에 답하시오.",lines:["One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you’ve ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren’t just automatic reactions. They’re shaped by how we interpret events. Here’s how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. Change the judgment, and you change the emotion. This doesn’t mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better."]},expl:"",type:"제목"},{n:9,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:5,stem:[],opts:["고대 그리스 조각은 사실주의 예술의 정점을 보여 준다.","추상 미술은 대중에게 이해되기 어렵다는 한계가 있다.","예술 작품의 가치는 제작 기법의 숙련도로 결정된다.","시대가 달라져도 예술이 추구하는 목적은 변하지 않는다.","예술을 현실의 모방으로만 규정하는 것은 충분하지 않다."],answer:5,passage:{title:"[9] 다음 글을 읽고 물음에 답하시오.",lines:["The ancient Greeks felt that the visual artist’s goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950’s, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis—simple copying—does not sufficiently define art."]},expl:"",type:"요지"},{n:10,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["training methods that prevent common running injuries","why our bodies know more about running than our minds do","how supercomputers simulate complex human movement","the history of long-distance running competitions","reasons running is better exercise than walking"],answer:2,passage:{title:"[10] 다음 글을 읽고 물음에 답하시오.",lines:["If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn’t mean our bodies don’t know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."]},expl:"",type:"주제"},{n:11,area:"독해",q:"윗글의 요지로 가장 적절한 것은?",pts:5,stem:[],opts:["반려견의 냄새를 없애려면 잦은 목욕이 가장 효과적이다.","반려견의 피부 질환은 대부분 유전적 요인에서 비롯된다.","반려동물 정기 검진은 질병을 조기에 발견하는 데 도움이 된다.","반려동물 돌봄은 주인의 취향이 아니라 동물의 필요를 기준으로 해야 한다.","털이 두꺼운 반려견은 빗질보다 목욕이 더 중요하다."],answer:4,passage:{title:"[11] 다음 글을 읽고 물음에 답하시오.",lines:["Our number one criterion for how we care for our pets should be, “Is this what they actually need? How is it impacting them?” rather than, “What do I want?” For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the ‘doggy’ smell, but veterinary dermatologists warn against such practices, as they are not good for a dog’s skin. If someone is really concerned about their dog’s smell they can use waterless shampoo and thoroughly brush their dog every day but keep the baths down to once or twice a week at most. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don’t need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks."]},expl:"",type:"요지"},{n:12,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:5,stem:[],opts:["Sudoku Is Mathematics, Whether You Admit It or Not","Numbers: The Heart of Every Newspaper Puzzle","Why Newspapers Stopped Printing Logic Games","Art and Math: Two Worlds That Never Meet","Puzzles That Actually Improve Your Memory"],answer:1,passage:{title:"[12] 다음 글을 읽고 물음에 답하시오.",lines:["The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections. Take, for example, the Sudoku puzzles that appear daily in newspapers. The objective is to complete a 9 × 9 grid, starting from a few given numbers or clues, while ensuring that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once. But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols. They could be nine letters or nine shapes. It’s the pattern that matters. One Irish daily paper publishes these puzzles with the statement ‘There’s no maths involved, simply use reasoning and logic!’ It seems that even the idea that something might be spoiled by mathematics is enough to scare off potential solvers! Could you imagine the promotion of an exhibition in the National Gallery with the slogan ‘No art involved, just painting and sculpture’? If you can do Sudoku, you can do maths!"]},expl:"",type:"제목"},{n:13,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["the difficulty of observing stars without modern equipment","ancient civilizations that worshipped the stars","how our understanding of the universe has developed over time","Galileo’s conflict with the authorities of his time","why the telescope replaced mathematics in astronomy"],answer:3,passage:{title:"[13] 다음 글을 읽고 물음에 답하시오.",lines:['Even before telescopes existed, people looked out into space and tried to understand the universe. The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea. Copernicus watched the stars and took measurements by eye. He concluded that the view of the universe accepted at the time—that the Sun traveled around Earth—was wrong, and that it was in fact Earth that traveled around the Sun. <u class="g">Despite widespread objections to his ideas, he published his theory in a book.</u> Later astronomers built on Copernicus’ work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth’s Moon. He also confirmed that Copernicus’ theory was correct. Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works.']},expl:"",type:"주제"},{n:14,area:"독해",q:"윗글의 주제로 가장 적절한 것은?",pts:5,stem:[],opts:["the origin of body parts used as early measuring tools","how trade disputes shaped early legal systems","differences between subjective and objective knowledge","the role of language in preserving local cultures","why shared definitions became necessary for units of measurement"],answer:5,passage:{title:"[14] 다음 글을 읽고 물음에 답하시오.",lines:['To harness the full potential of units of measurement, we need some degree of consistency. Subjective measures contain useful knowledge, but this can be difficult to share, based as it is on an individual’s experience. The historian of science Theodore M. Porter describes measurement as a ‘technology of distance’: a tool that uses shared rules to bridge differences of culture and geography, allowing for the exchange of information. <u class="g">Following this logic, if measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate.</u> In the earliest societies, these definitions might need to be shared no more widely than a single settlement, meaning that the definition can be no more complex than knowing that a unit was equal to a certain body part. As these communities grew in size, though, the inadequacies of this system would become evident. Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement.']},expl:"",type:"주제"},{n:15,area:"독해",q:"윗글의 제목으로 가장 적절한 것은?",pts:5,stem:[],opts:["Underground Cities Built by Insects and Humans","Tiny Farmers: How Leaf-Cutter Ants Grow Their Food","Why Ants Prefer Leaves to Any Other Food","The Fungus That Secretly Controls an Entire Colony","Lessons Human Farmers Learned from Insects"],answer:2,passage:{title:"[15] 다음 글을 읽고 물음에 답하시오.",lines:["With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they’re farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don’t eat these leaves. Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground ‘gardens.’ The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Using this successful farming strategy, the ants build enormous nests underground, something spanning hundreds of square meters. Just like human
